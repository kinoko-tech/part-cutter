      const xm = median(real.map((l) => (l.x0 + l.x1) / 2));
      const gaps = [];
      for (let k = 1; k < lines.length; k++) gaps.push(lines[k].y(xm) - lines[k - 1].y(xm));
      const spacing = median(gaps);
      let lx0 = median(real.map((l) => l.x0 + sliceW / 2)) + sliceW;
      let lx1 = median(real.map((l) => l.x1 - sliceW / 2)) - sliceW;
      if (lx0 > lx1) { const m = (lx0 + lx1) / 2; lx0 = m; lx1 = m; }
      let fns = lines.map((l) => l.y);
      const tl = traceEnd(bin, w, h, fns, spacing, sp, lx0, -1, th);
      const tr = traceEnd(bin, w, h, fns, spacing, sp, lx1, +1, th);
      const xL = tl.x, xR = tr.x;
      const bend = Math.max(tl.maxDev, tr.maxDev);
      if (bend > 0.9) fns = extendCurves(fns, tl.devs, tr.devs, lx0, lx1, w, sp);
      const str = median(real.map((l) => l.str));
      staves.push({
        n: lines.length, lines: fns, spacing, xL, xR, str,
        top: fns[0], bottom: fns[fns.length - 1],
        yc: (fns[0]((xL + xR) / 2) + fns[fns.length - 1]((xL + xR) / 2)) / 2,
      });
    }
    // merge duplicates (same staff found twice)
    staves.sort((a, b) => a.yc - b.yc);
    const uniq = [];
    for (const s of staves) {
      const prev = uniq[uniq.length - 1];
      if (prev && Math.abs(prev.yc - s.yc) < 0.8 * sp && Math.min(prev.xR, s.xR) > Math.max(prev.xL, s.xL)) {
        if (s.xR - s.xL > prev.xR - prev.xL) uniq[uniq.length - 1] = s;
        continue;
      }
      uniq.push(s);
    }
    const widths = uniq.map((s) => s.xR - s.xL);
    const maxW = widths.length ? Math.max(...widths) : 0;
    const strMed = median(uniq.map((s) => s.str));
    const kept = uniq.filter((s) => s.xR - s.xL >= Math.max(0.3 * maxW, 12 * sp) && s.str >= 0.62 * strMed);
    kept.sort((a, b) => a.yc - b.yc);
    const std = kept.filter((s) => s.n === 5).map((s) => s.spacing);
    const stdSp = std.length ? median(std) : sp;
    // a 5-line staff is TAB only when clearly wider than the ordinary staves around it
    // (scans of bound books change the scale down the page)
    const fiveK = kept.filter((s) => s.n === 5);
    for (const s of kept) {
      const near = fiveK.filter((o) => o !== s).sort((p, q) => Math.abs(p.yc - s.yc) - Math.abs(q.yc - s.yc)).slice(0, 3);
      const loc = near.length ? median(near.map((o) => o.spacing)) : stdSp;
      if (s.n !== 5) {
        s.tab = true;
        // a 4-line group without the wide TAB spacing is probably a 5-line staff missing a line
        s.maybe5 = s.n === 4 && s.spacing < loc * 1.25;
        continue;
      }
      s.tab = s.spacing > stdSp * 1.22 && s.spacing > loc * 1.22;
    }
    let systems = groupSystems(bin, w, h, kept, sp, grayIn);
    if (kept.length >= 4 && systems.every((q) => q.length === 1)) systems = groupByGaps(kept, systems, sp);
    // all staves of a system share the same right end (final barline)
    for (const sys of systems) {
      if (sys.length < 3) continue;
      const mr = median(sys.map((k) => kept[k].xR));
      for (const k of sys) if (Math.abs(kept[k].xR - mr) > 1.5 * sp) kept[k].xR = Math.round(mr);
      const ml = median(sys.map((k) => kept[k].xL));
      for (const k of sys) if (Math.abs(kept[k].xL - ml) > 1.5 * sp) kept[k].xL = Math.round(ml);
    }
    for (const sys of systems) {
      const seen = {};
      sys.forEach((k, idx) => {
        const nxt = idx + 1 < sys.length ? kept[sys[idx + 1]] : null;
        const st = kept[k];
        st.tabBelow = !st.tab && !!(nxt && nxt.tab);
        const key = st.n + ':' + (st.tab ? 't' : '') + (st.tabBelow ? nxt.n : 0);
        st.ordinal = seen[key] || 0;
        seen[key] = st.ordinal + 1;
      });
    }
    return { metrics, staves: kept, systems, stdSpace: stdSp };
  }

  // follow a staff outward from xStart (inside the staff) to its end, tolerating curled paper.
  // returns the last x where the lines are present and the vertical deviation from the given curves.
  function traceEnd(bin, w, h, lines, spacing, sp, xStart, dir, thick) {
    const nL = lines.length;
    const isTab = nL !== 5 || spacing > 1.2 * sp;
    const needLine = Math.max(2, Math.ceil(nL * 0.4));
    const needSpace = Math.max(2, Math.ceil((nL - 1) * 0.5));
    const maxMiss = Math.max(3, Math.round((isTab ? 0.95 : 0.45) * sp));
    const maxVert = Math.max(5, Math.round((dir < 0 ? 2.8 : 1.6) * sp));
    const maxRun = (thick || 3) + 3;
    const thinAt = (x, y) => {
      if (y < 0 || y >= h || !bin[y * w + x]) return false;
      let a = y, b = y;
      while (a > 0 && bin[(a - 1) * w + x] && y - a <= maxRun) a--;
      while (b < h - 1 && bin[(b + 1) * w + x] && b - y <= maxRun) b++;
      return b - a + 1 <= maxRun;
    };
    let x = Math.round(clamp(xStart, 0, w - 1));
    const x00 = x;
    let dev = 0, trend = 0, maxDev = 0, started = false;
    let lastGood = x, miss = 0, vert = 0;
    const devs = [];
    while (x >= 0 && x < w) {
      let bestE = dev + trend, bestS = -1, bestLi = 0, bestD = 9;
      for (let d = -1; d <= 1; d++) {
        const e = dev + trend + d;
        let sc = 0, li = 0;
        for (let k = 0; k < nL; k++) {
          const y = Math.round(lines[k](x) + e);
          if (thinAt(x, y)) { sc += 2; li++; }
          else if (thinAt(x, y - 1) || thinAt(x, y + 1)) { sc += 1; li++; }
        }
        if (sc > bestS || (sc === bestS && Math.abs(d) < Math.abs(bestD))) { bestS = sc; bestE = e; bestLi = li; bestD = d; }
      }
      let si = 0;
      for (let k = 1; k < nL; k++) {
        const ym = Math.round((lines[k - 1](x) + lines[k](x)) / 2 + bestE);
        if (ym >= 0 && ym < h && bin[ym * w + x]) si++;
      }
      if (bestLi >= needLine) {
        trend = clamp(0.9 * trend + 0.1 * (bestE - dev), -0.25, 0.25);
        dev = bestE;
        started = true;
        lastGood = x; miss = 0; vert = 0;
        devs.push([x, dev]);
        if (Math.abs(dev) > maxDev) maxDev = Math.abs(dev);
      } else if (si >= needSpace) {
        if (++vert > maxVert) break;
      } else {
        vert = 0;
        dev += trend;
        // the start column may sit inside dense notation: keep looking for a while
        if (!started) { if (Math.abs(x - x00) > 3 * sp) break; }
        else if (++miss > maxMiss) break;
      }
      x += dir;
    }
    return { x: lastGood, devs, maxDev };
  }

  // add traced deviations to line curves (both ends), smoothed
  function extendCurves(fns, devL, devR, lx0, lx1, w, sp) {
    const win = Math.max(3, Math.round(sp));
    const smooth = (arr) => {
      if (!arr.length) return arr;
      const out = [];
      for (let i = 0; i < arr.length; i++) {
        let sum = 0, n = 0;
        for (let j = Math.max(0, i - win); j <= Math.min(arr.length - 1, i + win); j++) { sum += arr[j][1]; n++; }
        out.push([arr[i][0], sum / n]);
      }
      return out;
    };
    const R = smooth(devR);              // increasing x
    const L = smooth(devL).reverse();    // make increasing x
    const devAt = (x) => {
      if (x > lx1 && R.length) {
        if (x >= R[R.length - 1][0]) return R[R.length - 1][1];
        let lo = 0, hi = R.length - 1;
        if (x <= R[0][0]) return R[0][1] * (x - lx1) / Math.max(1, R[0][0] - lx1);
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (R[m][0] <= x) lo = m; else hi = m; }
        const t = (x - R[lo][0]) / Math.max(1, R[hi][0] - R[lo][0]);
        return R[lo][1] + (R[hi][1] - R[lo][1]) * t;
      }
      if (x < lx0 && L.length) {
        if (x <= L[0][0]) return L[0][1];
        if (x >= L[L.length - 1][0]) return L[L.length - 1][1] * (lx0 - x) / Math.max(1, lx0 - L[L.length - 1][0]);
        let lo = 0, hi = L.length - 1;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (L[m][0] <= x) lo = m; else hi = m; }
        const t = (x - L[lo][0]) / Math.max(1, L[hi][0] - L[lo][0]);
        return L[lo][1] + (L[hi][1] - L[lo][1]) * t;
      }
      return 0;
    };
    return fns.map((f) => lutCurve((x) => f(x) + devAt(x), w, 4));
  }

  function scanEnd(bin, w, h, lines, spacing, sp, xStart, dir, thick) {
    const nL = lines.length;
    const isTab = nL !== 5 || spacing > 1.2 * sp;
    const needLine = Math.max(2, Math.ceil(nL * 0.4));
    const needSpace = Math.max(2, Math.ceil((nL - 1) * 0.5));
    const maxMiss = Math.max(3, Math.round((isTab ? 0.95 : 0.45) * sp));
    const maxVert = Math.max(6, Math.round(2.5 * sp));
    const maxRun = (thick || 3) + 3;
    let x = Math.round(clamp(xStart, 0, w - 1));
    let lastGood = x, miss = 0, vert = 0;
    const thinInkAt = (xx, yy) => {
      const yi = Math.round(yy);
      let q = -1;
      for (const d of [0, -1, 1]) {
        const t = yi + d;
        if (t >= 0 && t < h && bin[t * w + xx]) { q = t; break; }
      }
      if (q < 0) return 0;
      let a = q, b = q;
      while (a > 0 && bin[(a - 1) * w + xx] && q - a <= maxRun) a--;
      while (b < h - 1 && bin[(b + 1) * w + xx] && b - q <= maxRun) b++;
      return b - a + 1 <= maxRun ? 1 : 0;
    };
    while (x >= 0 && x < w) {
      let li = 0, si = 0;
      let prev = lines[0](x);
      li += thinInkAt(x, prev);
      for (let k = 1; k < nL; k++) {
        const y = lines[k](x);
        li += thinInkAt(x, y);
        const ym = Math.round((prev + y) / 2);
        if (ym >= 0 && ym < h && bin[ym * w + x]) si++;
        prev = y;
      }
      if (li >= needLine) {
        lastGood = x; miss = 0; vert = 0;
      } else if (si >= needSpace) {
        vert++;
        if (vert > maxVert) break;
      } else {
        vert = 0;
        if (++miss > maxMiss) break;
      }
      x += dir;
    }
    return lastGood;
  }

  function groupSystems(bin, w, h, staves, sp, gray) {
    const systems = [];
    let cur = [];
    const bw = Math.max(3, Math.round(0.35 * sp));
    const inkAtG = (x, y) => {
      if (x < 5 || x >= w - 5 || y < 0 || y >= h) return false;
      const k = y * w + x;
      if (bin[k]) return true;
      return !!gray && gray[k] < Math.min(gray[k - 4], gray[k + 4]) - 14;
    };
    // follow a (possibly slanted or wavy) vertical line from staff a down to staff s
    const vertical = (a, s, xa, xb) => {
      const ya = Math.ceil(a.bottom(xa) + 2), yb = Math.floor(s.top(xb) - 2);
      if (yb <= ya) return 1;
      const span = Math.max(3, Math.round(0.6 * sp));
      const rows = yb - ya + 1;
      let best = 0;
      const starts = [];
      for (let o = -span; o <= span; o++) {
        const x = Math.round(xa) + o;
        let c = 0;
        for (let y = ya; y < Math.min(yb, ya + 4); y++) if (inkAtG(x, y)) c++;
        if (c >= 2) starts.push(x);
      }
      vertical.bestX = Math.round(xa);
      for (const x0 of starts) {
        let x = x0, hit = 0, miss = 0;
        for (let y = ya; y <= yb; y++) {
          const t = rows > 1 ? (y - ya) / (rows - 1) : 0;
          const drift = Math.round((xb - xa) * t) - Math.round((xb - xa) * (rows > 1 ? (y - 1 - ya) / (rows - 1) : 0));
          x += y > ya ? drift : 0;
          if (inkAtG(x, y)) hit++;
          else if (inkAtG(x - 1, y)) { hit++; x -= 1; }
          else if (inkAtG(x + 1, y)) { hit++; x += 1; }
          else if (++miss > rows * 0.2) break;
        }
        const f = hit / rows;
        if (f > best) { best = f; vertical.bestX = x0; }
        if (best >= 0.97) break;
      }
      return best;
    };
    // search a systemic barline near xc: brackets and braces sit left of it, so look mostly right
    const scanBar = (a, s, xc) => {
      const stepX = Math.max(3, Math.round(0.6 * sp));
      let best = 0, bx = -1;
      for (let x = Math.round(xc - sp); x <= Math.round(xc + 3 * sp); x += stepX) {
        const v = vertical(a, s, x, x);
        if (v > best) { best = v; bx = vertical.bestX; }
        if (best >= 0.97) break;
      }
      return { v: best, x: bx };
    };
    const plausibleAt = (st, x) => x >= st.xL - 0.3 * (st.xR - st.xL) && x < st.xR - 10 * sp;
    for (let i = 0; i < staves.length; i++) {
      const s = staves[i];
      if (!cur.length) { cur.push(i); continue; }
      const a = staves[cur[cur.length - 1]];
      let connected = false;
      const tolX = Math.max(6, 0.6 * sp);
      const dx = Math.abs(a.xL - s.xL);
      if (dx <= tolX) connected = vertical(a, s, a.xL, s.xL) >= 0.85;
      if (!connected && dx > tolX) {
        // one of the two left ends is wrong: the barline must continue at the true one
        if (plausibleAt(s, a.xL) && vertical(a, s, a.xL, a.xL) >= 0.9) { connected = true; s.xL = a.xL; }
        else if (plausibleAt(a, s.xL) && vertical(a, s, s.xL, s.xL) >= 0.9) { connected = true; a.xL = s.xL; }
      }
      if (!connected) {
        // the barline may sit a little right of where the lines were traced to (bracket ends,
        // faint line starts): scan for it near the known left ends
        const refs = [a.xL];
        if (cur.length >= 2) refs.push(median(cur.map((k) => staves[k].xL)));
        if (dx > tolX) refs.push(s.xL);
        for (const xr of refs) {
          if (!plausibleAt(s, xr) || !plausibleAt(a, xr)) continue;
          const r = scanBar(a, s, xr);
          if (r.v >= 0.9) {
            connected = true;
            if (s.xL > r.x + 1.5 * sp) s.xL = r.x;
            if (a.xL > r.x + 1.5 * sp) a.xL = r.x;
            break;
          }
        }
      }
      if (connected) cur.push(i);
      else { systems.push(cur); cur = [i]; }
    }
    if (cur.length) systems.push(cur);
    return systems;
  }

  // fallback when no systemic barlines were found: split where gaps are clearly larger
  function groupByGaps(staves, systems, sp) {
    const gaps = [];
    for (let i = 0; i + 1 < staves.length; i++) {
      const a = staves[i], b = staves[i + 1];
      const xm = (Math.max(a.xL, b.xL) + Math.min(a.xR, b.xR)) / 2;
      const aligned = Math.abs(a.xL - b.xL) <= 2 * sp && Math.abs(a.xR - b.xR) <= 2 * sp;
      gaps.push(aligned ? b.top(xm) - a.bottom(xm) : Infinity);
    }
    const finite = gaps.filter((g) => isFinite(g)).sort((p, q) => p - q);
    let thr = Infinity;
    if (finite.length >= 3) {
      let bestT = -1, bestV = -1;
      for (let k = 1; k < finite.length; k++) {
        const lo = finite.slice(0, k), hi = finite.slice(k);
        const ml = lo.reduce((x, y) => x + y, 0) / lo.length, mh = hi.reduce((x, y) => x + y, 0) / hi.length;
        const v = lo.length * hi.length * (mh - ml) * (mh - ml);
        if (v > bestV) { bestV = v; bestT = k; }
      }
      const lo = finite.slice(0, bestT), hi = finite.slice(bestT);
      const ml = lo.reduce((x, y) => x + y, 0) / lo.length, mh = hi.reduce((x, y) => x + y, 0) / hi.length;
      const clear = finite[bestT] >= 1.5 * finite[bestT - 1];
      if (mh >= 1.8 * ml && clear && lo.length >= hi.length) thr = (finite[bestT - 1] + finite[bestT]) / 2;
    }
    // runs separated by misalignment or large gaps
    const runs = [[0]];
    for (let i = 0; i < gaps.length; i++) {
      if (isFinite(gaps[i]) && gaps[i] < thr && gaps[i] < 14 * sp) runs[runs.length - 1].push(i + 1);
      else runs.push([i + 1]);
    }
    const out = [];
    for (const run of runs) {
      const kinds = new Set(run.map((k) => staves[k].n + (staves[k].tab ? 't' : '')));
      if (run.length > 1 && (isFinite(thr) || kinds.size > 1)) out.push(run);
      else for (const k of run) out.push([k]);
    }
    return out;
  }

  // ------------------------------------------------------ staff signatures
  function gridSample(bin, w, h, x0, x1, yTopF, yBotF, padTop, padBot, gw, gh) {
    const out = new Float32Array(gw * gh);
    let sum = 0;
    for (let gxI = 0; gxI < gw; gxI++) {
      for (let sxI = 0; sxI < 3; sxI++) {
        const x = Math.round(x0 + ((gxI + (sxI + 0.5) / 3) / gw) * (x1 - x0));
        if (x < 0 || x >= w) continue;
        const yt = yTopF(x) - padTop, yb = yBotF(x) + padBot;
        for (let gyI = 0; gyI < gh; gyI++) {
          for (let syI = 0; syI < 3; syI++) {
            const y = Math.round(yt + ((gyI + (syI + 0.5) / 3) / gh) * (yb - yt));
            if (y < 0 || y >= h) continue;
            if (bin[y * w + x]) { out[gyI * gw + gxI] += 1 / 9; sum += 1 / 9; }
          }
        }
      }
    }
    return { g: out, sum };
  }

  function computeSignatures(bin, w, h, det) {
    const sp = det.metrics.space;
    for (const s of det.staves) {
      const pad = 1.2 * sp;
      const head = gridSample(bin, w, h, s.xL + 0.25 * sp, s.xL + 3.2 * sp, s.top, s.bottom, pad, pad, 16, 20);
      // label: fine grid, then crop to its ink bounding box
      const GW = 120, GH = 18;
      const lx0 = s.xL - 11 * sp, lx1 = s.xL - 1.2 * sp;
      const raw = gridSample(bin, w, h, lx0, lx1, s.top, s.bottom, 0.4 * sp, 0.4 * sp, GW, GH).g;
      // label = rightmost cluster of ink columns (nearest to the staff); ignore dense edge junk
      const colInk = new Float32Array(GW);
      for (let x = 0; x < GW; x++) {
        let c = 0;
        for (let y = 0; y < GH; y++) if (raw[y * GW + x] > 0.3) c++;
        colInk[x] = c > GH * 0.85 ? 0 : c;
      }
      const gapCols = Math.max(3, Math.round(GW * (1.2 / 9.8)));
      let cx1 = -1;
      for (let x = GW - 1; x >= 0; x--) if (colInk[x] > 0) { cx1 = x; break; }
      let cx0 = cx1;
      if (cx1 >= 0) {
        let gap = 0;
        for (let x = cx1; x >= 0; x--) {
          if (colInk[x] > 0) { cx0 = x; gap = 0; } else if (++gap > gapCols) break;
        }
      }
      let bx0 = GW, bx1 = -1, by0 = GH, by1 = -1, ink = 0;
      for (let y = 0; y < GH; y++) for (let x = Math.max(0, cx0); x <= cx1; x++) {
        if (colInk[x] > 0 && raw[y * GW + x] > 0.3) {
          ink++;
          if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
          if (y < by0) by0 = y; if (y > by1) by1 = y;
        }
      }
      let label = null;
      if (ink >= 6 && bx1 - bx0 >= 2) {
        const LW = 32, LH = 10;
        const g = new Float32Array(LW * LH);
        for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
          const sx = bx0 + ((x + 0.5) / LW) * (bx1 - bx0 + 1);
          const sy = by0 + ((y + 0.5) / LH) * (by1 - by0 + 1);
          g[y * LW + x] = raw[Math.min(GH - 1, Math.floor(sy)) * GW + Math.min(GW - 1, Math.floor(sx))];
        }
        label = { g, width: ((bx1 - bx0 + 1) / GW) * (lx1 - lx0) / sp, height: ((by1 - by0 + 1) / GH) };
      }
      s.sig = { head: head.g, label };
    }
  }

  function ncc(a, b, gw, gh, maxShift) {
    let best = -1;
    for (let sh = -maxShift; sh <= maxShift; sh++) {
      let n = 0, ma = 0, mb = 0;
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        const xb = x + sh;
        if (xb < 0 || xb >= gw) continue;
        ma += a[y * gw + x]; mb += b[y * gw + xb]; n++;
      }
      if (!n) continue;
      ma /= n; mb /= n;
      let sab = 0, saa = 0, sbb = 0;
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        const xb = x + sh;
        if (xb < 0 || xb >= gw) continue;
        const da = a[y * gw + x] - ma, db = b[y * gw + xb] - mb;
        sab += da * db; saa += da * da; sbb += db * db;
      }
      if (saa < 1e-6 || sbb < 1e-6) continue;
      const v = sab / Math.sqrt(saa * sbb);
      if (v > best) best = v;
    }
    return best;
  }

  function staffSimilarity(A, B) {
    let s = 0.2;
    if (A.n !== B.n) {
      // tolerate a 5-line staff that was found with one line missing
      if (!((A.n === 5 && !A.tab && B.maybe5) || (B.n === 5 && !B.tab && A.maybe5))) return -1;
      // the signature grids are framed by the (shorter) line span, so they compare worse
      s += 0.05;
      const la = A.sig.label, lb = B.sig.label;
      let lsim = 0.35;
      if (la && lb) lsim = Math.max(0, ncc(la.g, lb.g, 32, 10, 1)) * Math.pow(Math.min(la.width, lb.width) / Math.max(la.width, lb.width), 3);
      s += 0.42 * Math.max(0, ncc(A.sig.head, B.sig.head, 16, 20, 2)) + 0.38 * lsim;
      if (A.ordinal === B.ordinal) s += 0.03;
      return s;
    }
    s += 0.42 * Math.max(0, ncc(A.sig.head, B.sig.head, 16, 20, 2));
    const la = A.sig.label, lb = B.sig.label;
    let lsim;
    if (!la && !lb) lsim = 0.6;
    else if (!la || !lb) lsim = 0.35;
    else {
      const wr = Math.min(la.width, lb.width) / Math.max(la.width, lb.width);
      const shape = Math.max(0, ncc(la.g, lb.g, 32, 10, 1));
      lsim = shape * Math.pow(wr, 3);
    }
    s += 0.38 * lsim;
    if (A.tab !== B.tab) s -= 0.4;
    if (!A.tab && A.tabBelow !== B.tabBelow) s -= 0.45;
    if (A.ordinal === B.ordinal) s += 0.03;
    return s;
  }

  // align reference system staves -> target system staves (Needleman-Wunsch)
  const GAP = -0.3, MATCH_MIN = 0.5;
  function alignDetailed(refStaves, tgtStaves) {
    const m = refStaves.length, n = tgtStaves.length;
    const S = [];
    for (let i = 0; i < m; i++) {
      S.push([]);
      for (let j = 0; j < n; j++) S[i].push(staffSimilarity(refStaves[i], tgtStaves[j]));
    }
    const F = [], G = [];
    for (let i = 0; i <= m + 1; i++) { F.push(new Float64Array(n + 2)); G.push(new Float64Array(n + 2)); }
    for (let i = 1; i <= m; i++) F[i][0] = i * GAP;
    for (let j = 1; j <= n; j++) F[0][j] = j * GAP;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
      F[i][j] = Math.max(F[i - 1][j - 1] + S[i - 1][j - 1], F[i - 1][j] + GAP, F[i][j - 1] + GAP);
    }
    // G[i][j]: best score aligning ref[i..] with tgt[j..] (0-based suffixes)
    for (let i = m; i >= 0; i--) for (let j = n; j >= 0; j--) {
      if (i === m) { G[i][j] = (n - j) * GAP; continue; }
      if (j === n) { G[i][j] = (m - i) * GAP; continue; }
      G[i][j] = Math.max(G[i + 1][j + 1] + S[i][j], G[i + 1][j] + GAP, G[i][j + 1] + GAP);
    }
    const map = new Array(m).fill(null);
    let i = m, j = n;
    while (i > 0 && j > 0) {
      if (Math.abs(F[i][j] - (F[i - 1][j - 1] + S[i - 1][j - 1])) < 1e-9) {
        if (S[i - 1][j - 1] >= MATCH_MIN) map[i - 1] = { j: j - 1, sim: S[i - 1][j - 1] };
        i--; j--;
      } else if (Math.abs(F[i][j] - (F[i - 1][j] + GAP)) < 1e-9) i--;
      else j--;
    }
    // best total when ref i is forced onto tgt j
    const forced = (ii, jj) => F[ii][jj] + S[ii][jj] + G[ii + 1][jj + 1];
    // best total when ref i is left unmatched
    const gapped = (ii) => {
      let best = -Infinity;
      for (let jj = 0; jj <= n; jj++) best = Math.max(best, F[ii][jj] + GAP + G[ii + 1][jj]);
      return best;
    };
    return { S, map, best: F[m][n], forced, gapped, n };
  }

  function alignSystems(refStaves, tgtStaves) {
    return alignDetailed(refStaves, tgtStaves).map;
  }

  // ref selection [a..b] -> {a,b,conf} or {none:true,conf}
  const typeKey = (st) => st.n + (st.tab ? 't' : '') + (st.tabBelow ? 'b' : '');
  function matchSelection(refStaves, a, b, tgtStaves) {
    if (refStaves.length === tgtStaves.length && refStaves.every((st, i) => typeKey(st) === typeKey(tgtStaves[i]))) {
      // identical layout: same position = same part
      let sum = 0;
      for (let i = a; i <= b; i++) sum += staffSimilarity(refStaves[i], tgtStaves[i]);
      const sim = sum / (b - a + 1);
      return { a, b, conf: sim > 0.2 ? 0.95 : 0.6, sim, partial: false, structural: true };
    }
    const al = alignDetailed(refStaves, tgtStaves);
    const map = al.map;
    let core = a;
    for (let i = a; i <= b; i++) if (!refStaves[i].tab) { core = i; break; }
    const cm = map[core];
    let alt = -Infinity;
    if (cm) {
      for (let jj = 0; jj < al.n; jj++) if (jj !== cm.j && al.S[core][jj] >= MATCH_MIN) alt = Math.max(alt, al.forced(core, jj));
      // unmatched alternative (also covers matches below threshold)
      alt = Math.max(alt, al.gapped(core));
      for (let jj = 0; jj < al.n; jj++) if (jj !== cm.j && al.S[core][jj] < MATCH_MIN) alt = Math.max(alt, al.forced(core, jj));
    } else {
      for (let jj = 0; jj < al.n; jj++) if (al.S[core][jj] >= MATCH_MIN) alt = Math.max(alt, al.forced(core, jj));
    }
    const margin = isFinite(alt) ? al.best - alt : 1;
    const conf = clamp(margin / 0.25, 0.05, 1);
    if (!cm) return { none: true, conf };
    let lo = Infinity, hi = -Infinity, sum = 0, cnt = 0;
    for (let i = a; i <= b; i++) {
      const mm = map[i];
      if (!mm) continue;
      lo = Math.min(lo, mm.j); hi = Math.max(hi, mm.j);
      sum += mm.sim; cnt++;
    }
    return { a: lo, b: hi, conf: conf * Math.min(1, sum / cnt + 0.1), sim: sum / cnt, partial: cnt < b - a + 1 };
  }

  // propagate a selection from one system to every system (consensus voting)
  // systems: [{staves:[...]}]; returns array of {a,b,conf,partial} | null
  function propagateSelection(systems, refIdx, a, b) {
    const R = systems[refIdx];
    const N = systems.length;
    const direct = systems.map((S, k) => (k === refIdx ? { a, b, conf: 1 } : matchSelection(R.staves, a, b, S.staves)));
    // anchors: confident positive matches spread over the document
    const cands = [];
    direct.forEach((d, k) => { if (k !== refIdx && !d.none && d.conf >= 0.5 && !d.partial) cands.push({ k, d }); });
    cands.sort((p, q) => q.d.conf - p.d.conf);
    const anchors = cands.slice(0, 8);
    const out = new Array(N);
    for (let k = 0; k < N; k++) {
      if (k === refIdx) { out[k] = { a, b, conf: 1 }; continue; }
      const votes = new Map();
      const add = (res, wgt) => {
        const key = res.none ? 'none' : res.a + ':' + res.b;
        const v = votes.get(key) || { w: 0, res: null };
        v.w += wgt;
        if (!res.none && (!v.res || res.conf > v.res.conf)) v.res = res;
        votes.set(key, v);
      };
      add(direct[k], direct[k].conf * 1.2);
      for (const an of anchors) {
        if (an.k === k) continue;
        const r = matchSelection(systems[an.k].staves, an.d.a, an.d.b, systems[k].staves);
        add(r, r.conf * an.d.conf);
      }
      let best = null, total = 0;
      for (const v of votes.values()) { total += v.w; if (!best || v.w > best.w) best = v; }
      const share = total > 0 ? best.w / total : 0;
      if (!best.res) { out[k] = { none: true, conf: share }; continue; }
      out[k] = Object.assign({}, best.res, { conf: share });
    }
    return out;
  }

  // ----------------------------------------------------------- crop bounds
  function inkProfile(isInk, w, h, curve, x0, x1, dir, maxV) {
    const prof = new Float32Array(Math.max(1, maxV + 1));
    const step = 2;
    let n = 0;
    for (let x = Math.max(0, Math.round(x0)); x <= Math.min(w - 1, Math.round(x1)); x += step) n++;
    for (let v = 0; v <= maxV; v++) {
      let c = 0;
      for (let x = Math.max(0, Math.round(x0)); x <= Math.min(w - 1, Math.round(x1)); x += step) {
        const y = Math.round(curve(x) + dir * v);
        if (y >= 0 && y < h && isInk(x, y)) c++;
      }
      prof[v] = c / Math.max(1, n);
    }
    return prof;
  }

  function findCut(prof, sp, gapV, hasNeighbor, minBlankSp, pageEnd) {
    const start = Math.round(0.6 * sp);
    const blankTh = 0.004;
    const want = Math.max(3, Math.round((hasNeighbor ? (minBlankSp || 1.4) : 1.0) * sp));
    const weak = Math.max(2, Math.round(0.7 * sp));

    // (keeps a footer line or a page number out of the strip)
    const wantFar = Math.max(3, Math.round(0.8 * sp)), far = Math.round(2.2 * sp);
    let run = 0, firstWeak = -1;
    for (let v = start; v < prof.length; v++) {

  // content blocks (offset ranges) in a profile separated by blank bands >= gapSp
  function contentBlocks(prof, sp, from, gapSp) {

    for (let v = from; v < prof.length; v++) {

        cur.end = v; blank = 0;
      } else blank++;
    }
    return blocks;
  }

  // left edge of the systemic barline just left of xL
  function barlineLeft(isInk, staff, sp) {
    const top = staff.top, bot = staff.bottom;
    const xc = Math.round(staff.xL);
    const full = (xx) => {
      const yt = top(xx), yb = bot(xx);
      let hit = 0, tot = 0;
      for (let y = Math.round(yt); y <= Math.round(yb); y += 2) { tot++; if (isInk(xx, y)) hit++; }
      return hit / Math.max(1, tot) >= 0.8;

    let best = null;
    let run = null;
    const lo = Math.max(1, xc - Math.round(0.8 * sp)), hi = xc + Math.round(1.0 * sp);
    for (let xx = lo; xx <= hi + 1; xx++) {
      if (xx <= hi && full(xx)) { if (!run) run = { a: xx, b: xx }; else run.b = xx; continue; }
      if (run) {
        const d = run.b < xc ? xc - run.b : run.a > xc ? run.a - xc : 0;
        if (run.b - run.a <= 0.6 * sp && (!best || d < best.d)) best = { a: run.a, d };
        run = null;
      }
    }
    return best ? best.a - 2 : staff.xL - Math.round(0.3 * sp);
  }

  // Split the ink between two neighbouring staves by connected components.
  // dir=-1: neighbour is above our staff; dir=+1: neighbour is below.
  // Returns how far our content reaches (px from our line) and a mask of the neighbour's ink.
  function ownershipCut(isInk, w, h, ourLine, nbrLine, dir, xa0, xb0, sp) {
    const xa = Math.max(0, Math.floor(xa0)), xb = Math.min(w - 1, Math.ceil(xb0));
    const bw = xb - xa + 1;
    const lo = new Int32Array(bw), hi = new Int32Array(bw);
    let y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < bw; i++) {
      const yo = ourLine(xa + i), yn = nbrLine(xa + i);
      if (dir < 0) { lo[i] = Math.ceil(yn + 1.6); hi[i] = Math.floor(yo - 1.6); }
      else { lo[i] = Math.ceil(yo + 1.6); hi[i] = Math.floor(yn - 1.6); }
      lo[i] = Math.max(0, lo[i]); hi[i] = Math.min(h - 1, hi[i]);
      if (lo[i] < y0) y0 = lo[i];
      if (hi[i] > y1) y1 = hi[i];
    }
    if (!(y1 >= y0)) return null;
    const bh = y1 - y0 + 1;
    const lab = new Int32Array(bw * bh);
    const comps = [null];
    const stack = [];
    for (let i = 0; i < bw; i++) {
      for (let y = lo[i]; y <= hi[i]; y++) {
        const idx = (y - y0) * bw + i;
        if (lab[idx] || !isInk(xa + i, y)) continue;
        const id = comps.length;
        const c = { id, colTop: new Map(), colBot: new Map(), touchOur: false, touchNbr: false, own: 0, n: 0 };
        comps.push(c);
        lab[idx] = id;
        stack.push(i, y);
        while (stack.length) {
          const yy = stack.pop(), ii = stack.pop();
          c.n++;
          const ct = c.colTop.get(ii);
          if (ct === undefined || yy < ct) c.colTop.set(ii, yy);
          const cb = c.colBot.get(ii);
          if (cb === undefined || yy > cb) c.colBot.set(ii, yy);
          const nearTop = yy <= lo[ii], nearBot = yy >= hi[ii];
          if (dir < 0) { if (nearBot) c.touchOur = true; if (nearTop) c.touchNbr = true; }
          else { if (nearTop) c.touchOur = true; if (nearBot) c.touchNbr = true; }
          for (let di = -1; di <= 1; di++) {
            const i2 = ii + di;
            if (i2 < 0 || i2 >= bw) continue;
            for (let dy = -1; dy <= 1; dy++) {
              const y2 = yy + dy;
              if (y2 < lo[i2] || y2 > hi[i2]) continue;
              const k = (y2 - y0) * bw + i2;
              if (lab[k] || !isInk(xa + i2, y2)) continue;
              lab[k] = id;
              stack.push(i2, y2);

    }
    for (let k = 1; k < comps.length; k++) {
      const c = comps[k];

      else if (c.touchNbr && !c.touchOur) c.own = 2;
      else if (c.touchOur && c.touchNbr) c.own = 3;
    }
    // letters and syllables (lyrics under a staff, text above one) belong to the nearer staff;
    // a line of text is decided as a whole so that a phrase is never split
    const letters = [];
    for (let k = 1; k < comps.length; k++) {
      const c = comps[k];
      if (c.own) continue;
      let top = Infinity, bot = -Infinity, left = Infinity, right = -Infinity, sumO = 0, sumN = 0;
      for (const [ii, yt] of c.colTop) {

        if (yb > bot) bot = yb;
        if (ii < left) left = ii;
        if (ii > right) right = ii;
        const x = xa + ii, mid = (yt + yb) / 2;

      const cw = c.colTop.size, ch = bot - top + 1;
      const letter = ch >= 0.35 * sp && ch <= 2.2 * sp && right - left + 1 <= 2.5 * sp && c.n >= 0.25 * cw * ch;
      if (letter) letters.push({ c, top, bot, left, right, cw, sumO, sumN });
    }

    const used = new Uint8Array(letters.length);
    for (let i = 0; i < letters.length; i++) {

      const group = [letters[i]];
      used[i] = 1;
      let right = letters[i].right, top = letters[i].top, bot = letters[i].bot;
      for (let j = i + 1; j < letters.length; j++) {
        if (used[j]) continue;
        const L = letters[j];
        if (L.left - right > 1.2 * sp) break;
        const ov = Math.min(bot, L.bot) - Math.max(top, L.top);
        if (ov < 0.4 * Math.min(bot - top, L.bot - L.top)) continue;
        group.push(L); used[j] = 1;
        right = Math.max(right, L.right); top = Math.min(top, L.top); bot = Math.max(bot, L.bot);
      }
      let so = 0, sn = 0, cw = 0;
      for (const L of group) { so += L.sumO; sn += L.sumN; cw += L.cw; }
      const upperIsOur = dir > 0;
      const dUp = (upperIsOur ? so : sn) / cw, dDown = (upperIsOur ? sn : so) / cw;
      // lyrics sit under their staff: a tie goes up
      const toUpper = dUp <= dDown + 0.2 * sp;
      for (const L of group) L.c.own = toUpper === upperIsOur ? 1 : 2;
    }
    // floating marks go to whichever side's content is closest straight above/below them
    const maxLook = Math.round(3 * sp);
    for (let pass = 0; pass < 4; pass++) {
      let changed = false;
      for (let k = 1; k < comps.length; k++) {
        const c = comps[k];
        if (c.own) continue;
        let dOur = Infinity, dNbr = Infinity;
        for (const [ii, yt] of c.colTop) {
          const yb = c.colBot.get(ii);
          // toward our line
          const ourStart = dir < 0 ? yb + 1 : yt - 1;
          const nbrStart = dir < 0 ? yt - 1 : yb + 1;
          for (let d = 0; d <= maxLook; d++) {
            const y = ourStart - dir * -d; // dir<0: going down (+), dir>0: going up (-)
            const yy = dir < 0 ? ourStart + d : ourStart - d;
            if (yy < lo[ii] || yy > hi[ii]) { dOur = Math.min(dOur, d + (pass === 3 ? 0 : 0.5 * sp)); break; }
            const o = lab[(yy - y0) * bw + ii];
            if (o && o !== c.id && (comps[o].own === 1 || comps[o].own === 3)) { dOur = Math.min(dOur, d); break; }
            if (o && o !== c.id && comps[o].own === 2) break;
            void y;
          }
          for (let d = 0; d <= maxLook; d++) {
            const yy = dir < 0 ? nbrStart - d : nbrStart + d;
            if (yy < lo[ii] || yy > hi[ii]) { dNbr = Math.min(dNbr, d + 0.5 * sp); break; }
            const o = lab[(yy - y0) * bw + ii];
            if (o && o !== c.id && (comps[o].own === 2 || comps[o].own === 3)) { dNbr = Math.min(dNbr, d); break; }
            if (o && o !== c.id && comps[o].own === 1) break;
          }
        }
        if (dOur === Infinity && dNbr === Infinity) {
          if (pass < 3) continue;
          // fall back to plain distance between the two lines
          let sumO = 0, sumN = 0, cnt = 0;
          for (const [ii, yt] of c.colTop) {
            const yb = c.colBot.get(ii);
            const mid = (yt + yb) / 2;
            const x = xa + ii;
            sumO += Math.abs(mid - ourLine(x)); sumN += Math.abs(mid - nbrLine(x)); cnt++;
          }
          c.own = sumO <= sumN ? 1 : 2;
        } else c.own = dOur <= dNbr ? 1 : 2;
        changed = true;
      }
      if (!changed && pass >= 1) break;
    }
    // extent of our content and mask of the neighbour's
    let extent = 0;
    const bits = new Uint8Array(bw * bh);
    let masked = 0;
    for (let i = 0; i < bw; i++) {
      for (let y = lo[i]; y <= hi[i]; y++) {
        const id = lab[(y - y0) * bw + i];
        if (!id) continue;
        const o = comps[id].own;
        if (o === 1) {
          const d = Math.abs(y - ourLine(xa + i));
          if (d > extent) extent = d;
        } else if (o === 2) { bits[(y - y0) * bw + i] = 1; masked++; }
      }
    }
    if (masked) {
      const dil = new Uint8Array(bw * bh);
      for (let j = 0; j < bh; j++) for (let i = 0; i < bw; i++) {
        if (!bits[j * bw + i]) continue;
        for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
          const jj = j + dj, ii = i + di;
          if (jj < 0 || ii < 0 || jj >= bh || ii >= bw) continue;
          const id = lab[jj * bw + ii];
          if (id && comps[id].own === 1) continue; // never erase our own ink
          dil[jj * bw + ii] = 1;
        }
      }
      return { extent, mask: { xa, y0, bw, bh, bits: dil } };
    }
    return { extent, mask: null };
  }
  const inMask = (m, x, y) => {
    if (!m) return false;
    const i = x - m.xa, j = y - m.y0;
    return i >= 0 && j >= 0 && i < m.bw && j < m.bh && m.bits[j * m.bw + i] === 1;
  };

  // page: {w,h,isInk,det}; sel: {sys, a, b}; opts: {extraUp, extraDown, header, label}
  function computeRegion(page, sysIdx, a, b, opts) {
    const { w, h, det, isInk } = page;
    const sp = det.metrics.space;
    const st = det.staves;
    const sys = det.systems[sysIdx];
    const ia = sys[a], ib = sys[b];
    const A = st[ia], B = st[ib];
    let xL = Infinity, xR = -Infinity;
    for (let k = a; k <= b; k++) { xL = Math.min(xL, st[sys[k]].xL); xR = Math.max(xR, st[sys[k]].xR); }
    // left edge at the systemic barline next to the chosen staves (it may lean across the system)
    let barX = Infinity;
    for (let k = a; k <= b; k++) barX = Math.min(barX, barlineLeft(isInk, st[sys[k]], sp));
    const x0 = Math.max(0, opts.label ? xL - 11 * sp : barX);
    const x1 = Math.min(w - 1, xR + 1.0 * sp);
    const xs = [];
    for (let k = 0; k <= 8; k++) xs.push(xL + ((xR - xL) * k) / 8);
    // above
    const above = ia > 0 ? st[ia - 1] : null;
    let gapUp = above ? Math.min(...xs.map((x) => A.top(x) - above.bottom(x))) : Math.min(...xs.map((x) => A.top(x)));
    gapUp = Math.max(0, gapUp);
    const maxUp = Math.max(1, Math.round(Math.min(9 * sp, above ? gapUp - 0.5 * sp : gapUp)));
    const profUp = inkProfile(isInk, w, h, A.top, xL, xR, -1, maxUp);
    let up = findCut(profUp, sp, gapUp, !!above, opts.minBlank);
    let maskUp = null, maskDn = null;
    if (above && gapUp < 14 * sp) {
      const oc = ownershipCut(isInk, w, h, A.top, above.bottom, -1, x0, x1, sp);
      if (oc) { up = Math.max(0.6 * sp, oc.extent + 0.35 * sp); maskUp = oc.mask; }
    }
    // below
    const below = ib + 1 < st.length ? st[ib + 1] : null;
    let gapDn = below ? Math.min(...xs.map((x) => below.top(x) - B.bottom(x))) : Math.min(...xs.map((x) => h - 1 - B.bottom(x)));
    gapDn = Math.max(0, gapDn);
    const maxDn = Math.max(1, Math.round(Math.min(9 * sp, below ? gapDn - 0.5 * sp : gapDn)));
    const profDn = inkProfile(isInk, w, h, B.bottom, xL, xR, +1, maxDn);
    let down = findCut(profDn, sp, gapDn, !!below, opts.minBlank, true);
    if (below && gapDn < 14 * sp) {
      const oc = ownershipCut(isInk, w, h, B.bottom, below.top, +1, x0, x1, sp);
      if (oc) { down = Math.max(0.6 * sp, oc.extent + 0.35 * sp); maskDn = oc.mask; }
    }
    up = clamp(up + (opts.extraUp || 0) * sp, 0.3 * sp, Math.max(0.3 * sp, gapUp));
    down = clamp(down + (opts.extraDown || 0) * sp, 0.3 * sp, Math.max(0.3 * sp, gapDn));
    const region = { x0, x1, topCurve: A.top, botCurve: B.bottom, up, down, sp, masks: [maskUp, maskDn].filter(Boolean) };
    // header band above the first staff of the system (rehearsal marks, tempo, chords);
    // when the part itself starts with that staff, the band begins where the strip ends
    if (opts.header) {
      const T0 = st[sys[0]];
      const prev = sys[0] > 0 ? st[sys[0] - 1] : null;
      let gapH = prev ? Math.min(...xs.map((x) => T0.top(x) - prev.bottom(x))) : Math.min(...xs.map((x) => T0.top(x)));
      gapH = Math.max(0, gapH);
      let prevDown = 0;
      if (prev) {
        const pmax = Math.max(1, Math.round(Math.min(9 * sp, gapH - 0.5 * sp)));
        const pp = inkProfile(isInk, w, h, prev.bottom, xL, xR, +1, pmax);
        prevDown = findCut(pp, sp, gapH, true, opts.minBlank);
      }
      const limit = Math.max(0, Math.min(gapH - prevDown - 0.3 * sp, 13 * sp));
      // profile over the whole width incl. the area left of the barline (rehearsal marks),
      // ignoring the clef/key-signature area close to the staff
      const hx0 = Math.max(0, x0 - 5 * sp), maskX = T0.xL + 4.8 * sp, maskUpPx = 0.9 * sp;
      const maxV = Math.round(limit);
      const prof = new Float32Array(Math.max(1, maxV + 1));
      {
        const cols = [];
        for (let x = Math.round(hx0); x <= Math.min(w - 1, Math.round(xR)); x += 2) cols.push(x);
        for (let v = 0; v <= maxV; v++) {
          let c = 0, n = 0;
          for (const x of cols) {
            if (x < maskX && v < maskUpPx) continue;
            n++;
            const y = Math.round(T0.top(Math.max(x, x0)) - v);
            if (y >= 0 && y < h && isInk(x, y)) c++;
          }
          prof[v] = n ? c / n : 0;
        }
      }
      // bottom of the band: just above the top line (clef area is masked when extracting)
      let hBottom = Math.round(0.9 * sp);
      for (let v = Math.round(0.25 * sp); v < Math.min(prof.length, Math.round(0.9 * sp)); v++) {
        if (prof[v] <= 0.012) { hBottom = v; break; }
      }
      let bandKinds = opts.headerKinds || null;
      if (a === 0) {
        if (!prev) {
          // first system on the page: everything above the part's own top staff goes through the
          // classifier, which keeps its notes, slurs, chords and marks and drops the title block
          up = Math.min(up, hBottom);
          region.up = up;
          bandKinds = (bandKinds || HEADER_ALL).concat(['staff', 'lyric']);
        }
        hBottom = Math.max(hBottom, Math.round(up));
      }
      const blocks = contentBlocks(prof, sp, hBottom, 0.8);
      let hTop = hBottom;
      // stacked header rows (tempo, segno, chord names, rehearsal marks ...) until a clear gap;
      // what each part keeps is decided later by classifying the contents
      for (const bk of blocks) {
        if (hTop > hBottom && bk.start - hTop > 3.4 * sp) break;
        if (bk.start > 11 * sp) break;
        hTop = bk.end;
      }
      hTop = Math.min(limit, hTop + Math.round(0.4 * sp) + (opts.extraHeader || 0) * sp);
      if (hTop - hBottom > 1.0 * sp) {
        region.header = { curve: T0.top, from: hTop, to: hBottom, maskX, maskUp: maskUpPx, x0: hx0, startX: T0.xL, endX: T0.xR, kinds: bandKinds, first: !prev };
      }
    }
    return region;
  }

  // extract dewarped strip -> {w,h,data}
  function extractRegion(gray, w, h, region) {
    const { x0, x1, topCurve, botCurve, up, down } = region;
    const xm = (x0 + x1) / 2;
    const staffH = botCurve(xm) - topCurve(xm);
    const outW = Math.max(1, Math.round(x1 - x0));
    const outH = Math.max(1, Math.round(staffH + up + down));
    const strip = sampleStrip(gray, w, h, x0, outW, outH, (x, v) => {
      const yt = topCurve(x), yb = botCurve(x);
      const scale = (yb - yt) / Math.max(1, staffH);
      return yt + (v - up) * (Math.abs(scale - 1) < 0.08 ? scale : 1);
    }, region.masks);
    let header = null;
    if (region.header) {
      const hd = region.header;
      const hsp = region.sp || 12;
      const hh = Math.max(1, Math.round(hd.from - hd.to));
      // sample down across the top staff line: whatever touches it belongs to that staff
      const lineRow = Math.round(hd.from);
      const hhFull = lineRow + Math.max(2, Math.round(0.3 * hsp));
      const hx0 = hd.x0 != null ? Math.floor(hd.x0) : x0;
      const hW = outW + Math.round(x0 - hx0);
      const full = sampleStrip(gray, w, h, hx0, hW, hhFull, (x, v) => hd.curve(Math.max(x, x0)) - hd.from + v);
      const items = analyzeHeader(full, hsp, Math.round((hd.startX != null ? hd.startX : x0) - hx0), Math.round((hd.endX != null ? hd.endX : x1) - hx0), lineRow - 1, !!hd.first);
      const kept = filterHeader(full, items, hd.kinds);
      header = { w: hW, h: hh, data: full.data.slice(0, hW * hh), offsetX: Math.round(x0 - hx0) };
      header = kept ? trimRows(header, hsp) : null;
    }
    return { strip, header };
  }

  // ------------------------------------------------ header band contents
  // The band above the top staff mixes things for everyone (rehearsal marks, tempo, segno/coda,
  // chord names) with things of the top staff itself (its high notes, slurs, chorus words).
  // Components are grouped into items and classified so each part keeps only what it needs.
  // kinds: box | tempo | sign | end | chord | text | lyric | staff | page
  function headerComponents(img) {
    const { w, h, data } = img;
    const lab = new Int32Array(w * h);
    const stack = [];
    const comps = [];
    for (let i = 0; i < w * h; i++) {
      if (data[i] >= 170 || lab[i]) continue;
      const id = comps.length + 1;
      const pix = [];
      let minX = w, maxX = 0, minY = h, maxY = 0;
      stack.push(i);
      lab[i] = id;
      while (stack.length) {
        const q = stack.pop();
        pix.push(q);
        const x = q % w, y = (q - x) / w;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = y + dy;
          if (yy < 0 || yy >= h) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = x + dx;
            if (xx < 0 || xx >= w) continue;
            const k = yy * w + xx;
            if (!lab[k] && data[k] < 170) { lab[k] = id; stack.push(k); }
          }
        }
      }
      comps.push({ id, pix, minX, maxX, minY, maxY, bw: maxX - minX + 1, bh: maxY - minY + 1 });
    }
    return { comps, lab };
  }

  // enclosed background regions of one component (a coda sign has four, a box one)
  function holeStats(c, w) {
    const { bw, bh, minX, minY } = c;
    const m = new Uint8Array(bw * bh);
    for (const q of c.pix) { const x = q % w, y = (q - x) / w; m[(y - minY) * bw + (x - minX)] = 1; }
    const seen = new Uint8Array(bw * bh);
    const st = [];
    let fx0 = 0, fx1 = 0, fy0 = 0, fy1 = 0;
    const flood = (k0) => {
      let n = 0;
      fx0 = bw; fx1 = -1; fy0 = bh; fy1 = -1;
      st.push(k0); seen[k0] = 1;
      while (st.length) {
        const k = st.pop(); n++;
        const x = k % bw, y = (k - x) / bw;
        if (x < fx0) fx0 = x; if (x > fx1) fx1 = x; if (y < fy0) fy0 = y; if (y > fy1) fy1 = y;
        if (x > 0 && !m[k - 1] && !seen[k - 1]) { seen[k - 1] = 1; st.push(k - 1); }
        if (x < bw - 1 && !m[k + 1] && !seen[k + 1]) { seen[k + 1] = 1; st.push(k + 1); }
        if (y > 0 && !m[k - bw] && !seen[k - bw]) { seen[k - bw] = 1; st.push(k - bw); }
        if (y < bh - 1 && !m[k + bw] && !seen[k + bw]) { seen[k + bw] = 1; st.push(k + bw); }
      }
      return n;
    };
    for (let x = 0; x < bw; x++) { for (const y of [0, bh - 1]) { const k = y * bw + x; if (!m[k] && !seen[k]) flood(k); } }
    for (let y = 0; y < bh; y++) { for (const x of [0, bw - 1]) { const k = y * bw + x; if (!m[k] && !seen[k]) flood(k); } }
    let holes = 0, area = 0, big = 0, bigW = 0, bigH = 0;
    for (let k = 0; k < bw * bh; k++) {
      if (m[k] || seen[k]) continue;
      const n = flood(k);
      if (n >= 3) {
        holes++; area += n;
        if (n > big) { big = n; bigW = fx1 - fx0 + 1; bigH = fy1 - fy0 + 1; }
      }
    }
    return { holes, area, big, bigW, bigH };
  }

  // the bar of a cross sticking out on one side (coda sign)
  function crossArm(c, w, left) {
    const k = Math.max(1, Math.round(c.bw * 0.08));
    let lo = Infinity, hi = -1;
    for (const q of c.pix) {
      const x = q % w - c.minX, y = (q - (q % w)) / w - c.minY;
      if (left ? x < k : x >= c.bw - k) { if (y < lo) lo = y; if (y > hi) hi = y; }
    }
    if (hi < 0) return false;
    return hi - lo + 1 <= 0.32 * c.bh && Math.abs((lo + hi) / 2 - c.bh / 2) <= 0.2 * c.bh;
  }

  // share of the height covered by the longest vertical stroke near the left edge
  // (letters such as B, D, P have one; a segno does not)
  function leftStem(c, w) {
    const { bw, bh, minX, minY } = c;
    const cw = Math.max(1, Math.ceil(0.3 * bw));
    const m = new Uint8Array(cw * bh);
    for (const q of c.pix) {
      const x = q % w - minX;
      if (x < cw) m[((q - (q % w)) / w - minY) * cw + x] = 1;
    }
    let best = 0;
    for (let x = 0; x < cw; x++) {
      let run = 0;
      for (let y = 0; y < bh; y++) {
        run = m[y * cw + x] ? run + 1 : 0;
        if (run > best) best = run;
      }
    }
    return best / bh;
  }

  // a rectangular frame (rehearsal mark box)
  function isFrame(c, w, sp) {
    const { bw, bh, minX, minY } = c;
    if (bw < 0.9 * sp || bh < 0.9 * sp || bh > 3.8 * sp || bw > 14 * sp) return false;
    const t = Math.max(3, Math.round(0.42 * sp));
    const top = new Uint8Array(bw), bot = new Uint8Array(bw), lft = new Uint8Array(bh), rgt = new Uint8Array(bh);
    const corner = [0, 0, 0, 0];
    let inner = 0;
    for (const q of c.pix) {
      const x = q % w - minX, y = (q - (q % w)) / w - minY;
      if (y < t && x < t) corner[0]++;
      if (y < t && x >= bw - t) corner[1]++;
      if (y >= bh - t && x < t) corner[2]++;
      if (y >= bh - t && x >= bw - t) corner[3]++;
      if (y < t) top[x] = 1;
      if (y >= bh - t) bot[x] = 1;
      if (x < t) lft[y] = 1;
      if (x >= bw - t) rgt[y] = 1;
      if (x >= t && x < bw - t && y >= t && y < bh - t) inner++;
    }
    const frac = (a) => { let n = 0; for (const v of a) n += v; return n / a.length; };
    // square corners (a bold D or O is round there)
    if (corner.some((n) => n < 0.4 * t * t)) return false;
    // the letter inside may touch the frame, so allow inner ink but demand a large enclosed area
    if (!(frac(top) > 0.85 && frac(bot) > 0.85 && frac(lft) > 0.85 && frac(rgt) > 0.85 && inner < 0.5 * c.pix.length)) return false;
    const hs = holeStats(c, w);
    // the enclosed area spans nearly the whole frame (thin border), unlike bold letters
    return hs.big >= 0.25 * bw * bh && hs.bigW >= 0.7 * bw && hs.bigH >= 0.7 * bh;
  }

  function analyzeHeader(img, sp, startX, endX, attachRow, firstOnPage) {
    const { w, h } = img;
    const bandH = attachRow != null ? attachRow : h - 2;
    const { comps } = headerComponents(img);
    const items = [];
    const cornerW = Math.max(3 * sp, w * 0.05);
    for (const c of comps) {
      c.kind = null;
      c.fill = c.pix.length / (c.bw * c.bh);
      // touching the top staff line (or cut by the band's lower edge): part of that staff
      if (c.maxY >= bandH) c.kind = 'staff';
      else if (c.maxY < bandH * 0.55 && c.bw < 2.5 * sp && c.minX > w - cornerW && c.minX > endX + 0.5 * sp) c.kind = 'page';
      // page number in the other corner, and bits of glyphs cut off by the top of the band
      else if (c.maxY < bandH * 0.55 && c.bw < 2.5 * sp && c.maxX < cornerW && c.maxX < startX - 0.5 * sp && !isFrame(c, w, sp)) c.kind = 'page';
      else if (c.minY <= 1 && c.bh < 0.8 * sp && c.bw < 1.2 * sp) c.kind = 'page';
    }
    // typical letter height (chord names are the most common header glyphs)
    const letterHs = comps.filter((c) => !c.kind && c.bh >= 0.6 * sp && c.bh <= 3 * sp && c.bw <= 2.5 * sp && c.bw <= 1.6 * c.bh && c.fill > 0.35).map((c) => c.bh).sort((a, b) => a - b);
    const capRef0 = letterHs.length ? letterHs[Math.floor(letterHs.length * 0.6)] : 1.6 * sp;
    const letterLike = (c) => c.bh >= 0.6 * capRef0 && c.bh <= 1.4 * capRef0 && c.bw <= 1.6 * c.bh && c.fill >= 0.3;
    // rehearsal boxes and what is written inside them
    for (const c of comps) {
      if (c.kind || !isFrame(c, w, sp)) continue;
      c.kind = 'box';
      for (const d of comps) {
        if (d === c || d.kind) continue;
        if (d.minX >= c.minX && d.maxX <= c.maxX && d.minY >= c.minY && d.maxY <= c.maxY) d.kind = 'box';
      }
    }
    // ties, beams and slurs sitting among the attached notes (compared with the local height
    // the attached ink reaches, column by column)
    const topProf = new Int32Array(w).fill(h);
    for (const k of comps) {
      if (k.kind !== 'staff') continue;
      for (const q of k.pix) { const x = q % w, y = (q - x) / w; if (y < topProf[x]) topProf[x] = y; }
    }
    const reach = Math.round(0.5 * sp);
    for (const c of comps) {
      if (c.kind || letterLike(c)) continue;
      let top = h;
      for (let x = Math.max(0, c.minX - reach); x <= Math.min(w - 1, c.maxX + reach); x++) if (topProf[x] < top) top = topProf[x];
      if (c.maxY >= top - 0.3 * sp && top < bandH) c.kind = 'staff';
    }
    // a box whose top and bottom edges broke up (thin print, low resolution)
    {
      const data = img.data;
      const verts = comps.filter((c) => !c.kind && c.bh >= 1.5 * sp && c.bh <= 3.8 * sp && c.bw <= Math.max(3, 0.8 * sp));
      const faintRow = (x0, x1, y0, y1) => {
        let hit = 0, n = 0;
        for (let x = x0; x <= x1; x++) {
          n++;
          for (let y = Math.max(0, y0); y <= Math.min(h - 1, y1); y++) if (data[y * w + x] < 215) { hit++; break; }
        }
        return n ? hit / n : 0;
      };
      for (const L of verts) {
        if (L.kind) continue;
        for (const R of verts) {
          if (R === L || R.kind || R.minX <= L.maxX + 0.8 * sp || R.minX - L.maxX > 12 * sp) continue;
          if (Math.abs(L.minY - R.minY) > 0.35 * sp || Math.abs(L.maxY - R.maxY) > 0.35 * sp) continue;
          const y0 = Math.min(L.minY, R.minY), y1 = Math.max(L.maxY, R.maxY);
          if (faintRow(L.maxX + 1, R.minX - 1, y0 - 1, y0 + 2) < 0.8 || faintRow(L.maxX + 1, R.minX - 1, y1 - 2, y1 + 1) < 0.8) continue;
          L.kind = 'box'; R.kind = 'box';
          for (const d of comps) {
            if (!d.kind && d.minX > L.minX && d.maxX < R.maxX && d.minY >= y0 - 1 && d.maxY <= y1 + 1) d.kind = 'box';
          }
          break;
        }
      }
    }
    // long thin strokes: extender lines, brackets, slurs
    const thinStroke = (c) => c.pix.length / c.bw <= 0.42 * sp;
    for (const c of comps) {
      if (c.kind) continue;
      if (c.bw >= 2.2 * sp && thinStroke(c) && (c.bh <= 0.5 * sp || c.bw >= 4 * c.bh)) c.kind = 'line';
      else if (c.bw >= 1.1 * sp && c.bh <= 1.5 * sp && c.bw > 1.8 * c.bh && (c.fill < 0.3 || thinStroke(c) && c.fill < 0.45)) c.kind = 'line';
      // ledger lines of high notes
      else if (c.bh <= 0.35 * sp && c.bw >= 1.3 * sp && c.bw <= 2.6 * sp && c.fill >= 0.6 && c.minY > bandH - 6 * sp) c.kind = 'staff';
    }
    // coda (circle split by a cross) and segno (large S with a slash and two dots)
    for (const c of comps) {
      if (c.kind) continue;
      const big = Math.max(c.bw, c.bh);
      if (big < 0.9 * sp || big > 5 * sp) continue;
      const hs = holeStats(c, w);
      c.holes = hs.holes;
      const ar = c.bw / c.bh;
      if (hs.holes >= 4 && ar > 0.55 && ar < 1.5 && c.bh >= 0.9 * capRef0 && crossArm(c, w, true) && crossArm(c, w, false)) { c.kind = 'sign'; continue; }
      if (hs.holes >= 2 && ar > 0.45 && ar < 1.1 && c.bh >= 1.35 * capRef0 && c.fill > 0.3 && leftStem(c, w) < 0.8) {
        c.kind = 'sign';
        for (const d of comps) {
          if (d.kind || d.bw > 0.6 * sp || d.bh > 0.6 * sp || d.fill < 0.45) continue;
          if (d.minX > c.minX - 0.9 * sp && d.maxX < c.maxX + 0.9 * sp && d.minY > c.minY - 0.3 * sp && d.maxY < c.maxY + 0.3 * sp) d.kind = 'sign';
        }
      }
    }
    // tempo: a free note (solid head, thin stem) followed by "= 120"
    for (const c of comps) {
      if (c.kind) continue;
      if (c.bh < 1.5 * sp || c.bh > 5 * sp || c.bw > 2 * sp || c.bw < 0.6 * sp) continue;
      const rowsW = new Int32Array(c.bh), rowsMin = new Int32Array(c.bh).fill(w), rowsMax = new Int32Array(c.bh).fill(-1);
      for (const q of c.pix) {
        const x = q % w, y = (q - x) / w - c.minY;
        rowsW[y]++;
        if (x < rowsMin[y]) rowsMin[y] = x;
        if (x > rowsMax[y]) rowsMax[y] = x;
      }
      const span = (y) => (rowsMax[y] < 0 ? 0 : rowsMax[y] - rowsMin[y] + 1);
      let y0 = 0;
      while (y0 < c.bh && span(y0) <= Math.max(3, 0.5 * sp)) y0++;
      const stemH = y0, headH = c.bh - y0;
      if (stemH < 0.9 * sp || headH < 0.6 * sp || headH > 1.9 * sp) continue;
      let headW = 0, headInk = 0, headBox = 0;
      for (let y = y0; y < c.bh; y++) { const sp2 = span(y); headW = Math.max(headW, sp2); headInk += rowsW[y]; headBox += sp2; }
      if (!(headW >= 0.9 * sp && headBox > 0 && headInk / headBox > 0.8 && !holeStats(c, w).holes)) continue;
      // must be followed by "=" or "≒" (two short flat strokes, one above the other)
      const headTop = c.minY + y0, headBot = c.maxY;
      const bars = comps.filter((d) => d !== c && !d.kind && d.minX > c.maxX && d.minX - c.maxX <= 2 * sp &&
        d.bh <= 1.05 * sp && d.bw >= 0.4 * sp && d.bw <= 2.2 * sp && d.bw >= 1.2 * d.bh && d.pix.length / d.bw <= 0.55 * sp &&
        (d.minY + d.maxY) / 2 >= headTop - 1.2 * sp && (d.minY + d.maxY) / 2 <= headBot + 0.5 * sp);
      let eq = false;
      for (const a of bars) for (const b of bars) {
        if (a === b) continue;
        const dy = (b.minY + b.maxY) / 2 - (a.minY + a.maxY) / 2;
        if (dy >= 0.15 * sp && dy <= 1.4 * sp && Math.min(a.maxX, b.maxX) - Math.max(a.minX, b.minX) > 0.25 * sp) eq = true;
      }
      if (eq) c.kind = 'tempoNote';
    }
    // words: remaining glyphs joined by proximity on a shared line
    const rest = comps.filter((c) => !c.kind || c.kind === 'line');
    const glyphs = rest.filter((c) => !c.kind).sort((a, b) => a.minX - b.minX);
    const parent = new Map(glyphs.map((g) => [g, g]));
    const find = (g) => { while (parent.get(g) !== g) g = parent.get(g); return g; };
    const vOverlap = (a, b) => Math.min(a.maxY, b.maxY) - Math.max(a.minY, b.minY);
    for (let i = 0; i < glyphs.length; i++) {
      const a = glyphs[i];
      for (let j = i + 1; j < glyphs.length; j++) {
        const b = glyphs[j];
        if (b.minX - a.maxX > 0.55 * sp) break;
        const ov = vOverlap(a, b);
        const small = Math.min(a.bh, b.bh);
        const acc = (b.bh < 0.5 * sp || a.bh < 0.5 * sp) && ov > -0.6 * sp; // dots, flats above letters
        if (ov > 0.3 * small || acc) parent.set(find(b), find(a));
      }
    }
    const groups = new Map();
    for (const g of glyphs) {
      const r = find(g);
      if (!groups.has(r)) groups.set(r, []);
      groups.get(r).push(g);
    }
    const words = [];
    for (const list of groups.values()) {
      const wd = { comps: list, minX: w, maxX: 0, minY: h, maxY: 0, kind: null };
      for (const c of list) {
        wd.minX = Math.min(wd.minX, c.minX); wd.maxX = Math.max(wd.maxX, c.maxX);
        wd.minY = Math.min(wd.minY, c.minY); wd.maxY = Math.max(wd.maxY, c.maxY);
      }
      wd.bh = wd.maxY - wd.minY + 1;
      // letter height of the tallest non-accent glyph
      wd.cap = Math.max(...list.map((c) => c.bh));
      words.push(wd);
    }
    const lines = comps.filter((c) => (c.kind === 'line' || c.kind === 'staff') && c.bw >= 2.2 * sp && thinStroke(c) && c.bh <= 0.9 * sp && c.maxY < bandH);
    // words owned by a tempo note or a sign
    const attachTo = (anchor, kind, reach) => {
      let n = 0;
      for (const wd of words) {
        if (wd.kind) continue;
        const ov = Math.min(anchor.maxY, wd.maxY) - Math.max(anchor.minY, wd.minY);
        if (ov < 0.25 * Math.min(anchor.maxY - anchor.minY + 1, wd.bh)) continue;
        const gap = wd.minX > anchor.maxX ? wd.minX - anchor.maxX : anchor.minX - wd.maxX;
        if (gap <= reach) { wd.kind = kind; n += 1 + attachTo(wd, kind, reach * 0.6); }
      }
      return n;
    };
    for (const c of comps) if (c.kind === 'tempoNote') { c.kind = 'tempo'; attachTo(c, 'tempo', 1.8 * sp); }
    for (const c of comps) if (c.kind === 'sign' && c.holes != null) attachTo(c, 'sign', 1.5 * sp);
    // chorus / lyric words: followed by an extender line, and the words sharing their line
    for (const wd of words) {
      if (wd.kind) continue;
      for (const ln of lines) {
        const gap = ln.minX - wd.maxX;
        if (gap < -0.2 * sp || gap > 1.2 * sp) continue;
        if (ln.minY >= wd.minY - 0.2 * sp && ln.maxY <= wd.maxY + 0.8 * sp) { wd.kind = 'lyric'; break; }
      }
    }
    // labels written on a bracket of the top staff ("2x ⌐———┐")
    for (const wd of words) {
      if (wd.kind) continue;
      for (const ln of lines) {
        if (wd.minX < ln.minX - 0.5 * sp || wd.minX > ln.minX + 2 * sp) continue;
        if (wd.maxY >= ln.minY - 0.7 * sp && wd.maxY <= ln.maxY + 0.2 * sp && wd.maxX < ln.maxX) { wd.kind = 'staff'; break; }
      }
    }
    for (const wd of words) {
      if (wd.kind !== 'lyric') continue;
      for (const o of words) {
        if (o.kind || Math.abs(o.maxY - wd.maxY) > 0.35 * sp) continue;
        if (o.cap <= 1.25 * wd.cap) o.kind = 'lyric';
      }
    }
    // the rest: chord names (capital-height words), text at the right end (D.S., Fine), other text
    const caps = words.filter((wd) => !wd.kind).map((wd) => wd.cap).sort((a, b) => a - b);
    const capRef = caps.length ? caps[Math.floor(caps.length * 0.6)] : capRef0;
    // the page's title block and credits above the first system (above the tempo mark, or much larger)
    const tempoYs = comps.filter((c) => c.kind === 'tempo').map((c) => c.minY);
    let tempoTop = tempoYs.length ? Math.min(...tempoYs) : -Infinity;
    if (firstOnPage) {
      // on the first system of a page, text above every musical mark is the title block
      const markYs = comps.filter((c) => c.kind === 'tempo' || c.kind === 'box' || c.kind === 'sign').map((c) => c.minY);
      if (markYs.length) tempoTop = Math.min(...markYs);
    }
    for (const wd of words) {
      if (wd.kind) continue;
      if (wd.maxY < tempoTop - 0.3 * sp || wd.cap > 1.8 * capRef) wd.kind = 'page';
    }
    for (const wd of words) {
      if (wd.kind) continue;
      if (wd.maxX >= endX - 0.8 * sp && wd.maxX <= endX + 0.3 * sp && wd.minX > startX + 6 * sp && wd.maxY >= bandH - 4.5 * sp &&
        wd.comps.some(letterLike)) wd.kind = 'end';
      else if (wd.cap >= Math.max(0.85 * sp, 0.7 * capRef)) wd.kind = 'chord';
      else wd.kind = 'text';
    }
    for (const wd of words) for (const c of wd.comps) c.kind = wd.kind;
    for (const c of comps) {
      if (c.kind === 'line') c.kind = 'staff';
      if (!c.kind || c.kind === 'tempoNote') c.kind = 'text';
      items.push(c);
    }
    return items;
  }

  // keep the kinds a part needs; whiten the rest and faint leftovers
  const HEADER_ALL = ['box', 'tempo', 'sign', 'end', 'chord', 'text'];
  function filterHeader(img, items, kinds) {
    const { w, h, data } = img;
    const keep = new Set(kinds || HEADER_ALL);
    const keepNear = new Uint8Array(w * h);
    let kept = 0;
    for (const c of items) {
      const on = keep.has(c.kind);
      if (on) kept++;
      for (const q of c.pix) {
        const x = q % w, y = (q - x) / w;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          const xx = x + dx, yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
          if (!on) { if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) data[yy * w + xx] = 255; } else keepNear[yy * w + xx] = 1;
        }
      }
    }
    for (let i = 0; i < w * h; i++) if (data[i] < 255 && !keepNear[i] && data[i] >= 150) data[i] = 255;
    return kept;
  }

  // drop empty rows above and below the header content (keeps a small margin)
  function trimRows(img, sp) {
    const { w, h, data } = img;
    const rowInk = (y) => { for (let x = 0; x < w; x++) if (data[y * w + x] < 200) return true; return false; };
    let top = 0, bot = h - 1;
    while (top < h && !rowInk(top)) top++;
    if (top >= h) return img;
    while (bot > top && !rowInk(bot)) bot--;
    const m = Math.round(0.35 * sp);
    const y0 = Math.max(0, top - m), y1 = Math.min(h - 1, bot + m);
    if (y0 === 0 && y1 === h - 1) return img;
    const nh = y1 - y0 + 1;
    const out = new Uint8Array(w * nh);
    for (let y = 0; y < nh; y++) out.set(data.subarray((y0 + y) * w, (y0 + y + 1) * w), y * w);
    return { w, h: nh, data: out, offsetX: img.offsetX };
  }

  function sampleStrip(gray, w, h, x0, outW, outH, mapY, masks) {
    const out = new Uint8Array(outW * outH);
    const hasMask = masks && masks.length;
    for (let u = 0; u < outW; u++) {
      const x = x0 + u;
      const xi = Math.floor(x);
      const fx = x - xi;
      if (xi < 0 || xi >= w - 1) { for (let v = 0; v < outH; v++) out[v * outW + u] = 255; continue; }
      for (let v = 0; v < outH; v++) {
        const y = mapY(x, v);
        const yi = Math.floor(y);
        if (yi < 0 || yi >= h - 1) { out[v * outW + u] = 255; continue; }
        const fy = y - yi;
        const i = yi * w + xi;
        if (hasMask) {
          const xr = Math.round(x), yr = Math.round(y);
          let hit = false;
          for (const m of masks) if (inMask(m, xr, yr)) { hit = true; break; }
          if (hit) { out[v * outW + u] = 255; continue; }
        }
        const val = (gray[i] * (1 - fx) + gray[i + 1] * fx) * (1 - fy) + (gray[i + w] * (1 - fx) + gray[i + w + 1] * fx) * fy;
        out[v * outW + u] = (val + 0.5) | 0;
      }
    }
    return { w: outW, h: outH, data: out };
  }

  // ------------------------------------------------------------- pipeline
  // src: {w,h,data(gray)}; rgbaSmall optional {data,w,h,scale} for paper detection
  // opts: {mode:'photo'|'flat', corners, targetWidth, fixA4, onStage}
  async function processPage(src, opts) {
    const t0 = Date.now();
    const tick = opts.tick || (() => Promise.resolve());
    const stage = async (name) => { if (opts.onStage) opts.onStage(name); await tick(); };
    const W = src.w, H = src.h;
    let corners = opts.corners;
    let paper = null;
    if (!corners && opts.mode === 'photo' && opts.rgbaSmall) {
      const sm = opts.rgbaSmall;
      paper = detectPaper(sm.data, sm.w, sm.h);
      corners = paper.corners.map((c) => [c[0] * sm.scale, c[1] * sm.scale]);
      if (!paper.ok) corners = null;
    }
    if (!corners) corners = [[0, 0], [W - 1, 0], [W - 1, H - 1], [0, H - 1]];
    const isFull = corners[0][0] <= 1 && corners[0][1] <= 1 && corners[2][0] >= W - 2 && corners[2][1] >= H - 2 &&
      corners[1][0] >= W - 2 && corners[3][1] >= H - 2;
    let ratio = isFull ? H / W : estimateAspect(corners, W, H); // height/width as seen
    const sideW = (dist(corners[0], corners[1]) + dist(corners[3], corners[2])) / 2;
    const sideH = (dist(corners[0], corners[3]) + dist(corners[1], corners[2])) / 2;
    await stage('rectify');
    // orientation from a quick low-res view
    let rot = ((opts.rotate || 0) % 360 + 360) % 360;
    const lowSeen = (qW) => {
      const qH = Math.max(8, Math.round(qW * ratio));
      const Hs = homography([[0, 0], [qW, 0], [qW, qH], [0, qH]], corners);
      const g = warpGray(src.data, W, H, Hs, qW, qH);
      const nn = normalizeIllumination({ w: qW, h: qH, data: g });
      const th = clamp(otsu(nn.hist), 90, 215);
      const bb = new Uint8Array(qW * qH);
      for (let i = 0; i < bb.length; i++) bb[i] = nn.data[i] < th ? 1 : 0;
      return { bin: bb, w: qW, h: qH };
    };
    if (opts.autoRotate !== false) {
      const lo = lowSeen(1000);
      if (isSideways(lo.bin, lo.w, lo.h)) rot = 90;
    }
    const upright = rot % 180 === 0;
    let ratioU = upright ? ratio : 1 / ratio;
    if (opts.fixA4) ratioU = Math.SQRT2;
    const pageWsrc = upright ? sideW : sideH;
    const outW = Math.round(clamp(opts.targetWidth || pageWsrc, 1400, 2480));
    const outH = Math.round(outW * ratioU);
    const Wr = upright ? outW : outH, Hr = upright ? outH : outW;
    let s = src, sScale = 1;
    const shrink = Math.floor(pageWsrc / outW / 1.25);
    if (shrink >= 2) { s = downscaleMean(src, shrink); sScale = shrink; }
    const cs = corners.map((c) => [c[0] / sScale, c[1] / sScale]);
    const Hrect = homography([[0, 0], [Wr, 0], [Wr, Hr], [0, Hr]], cs);
    const Hup = matMul3(Hrect, rotMat(rot, Wr, Hr));
    // skew on the upright low-res view
    const q = 4;
    const qw = Math.round(outW / q), qh = Math.round(outH / q);
    const small = warpGray(s.data, s.w, s.h, matMul3(Hup, [q, 0, 0, 0, q, 0, 0, 0, 1]), qw, qh);
    const smallN = normalizeIllumination({ w: qw, h: qh, data: small });
    const thrS = clamp(otsu(smallN.hist), 90, 215);
    const binS = new Uint8Array(qw * qh);
    for (let i = 0; i < binS.length; i++) binS[i] = smallN.data[i] < thrS ? 1 : 0;
    const skew = estimateSkew(binS, qw, qh, 8);
    const theta = (skew.conf > 0.2 ? skew.angle : 0) * Math.PI / 180;
    let Hfin = matMul3(Hup, rotationAbout(theta, outW / 2, outH / 2));
    let rect = warpGray(s.data, s.w, s.h, Hfin, outW, outH);
    await stage('normalize');
    let norm = normalizeIllumination({ w: outW, h: outH, data: rect });
    let thr = clamp(otsu(norm.hist), 100, 215);
    const bin = new Uint8Array(outW * outH);
    // residual rotation measured locally (robust to curled paper): rotate for real instead of
    // leaving it to the vertical dewarp, which would shear barlines
    {
      for (let i = 0; i < bin.length; i++) bin[i] = norm.data[i] < thr ? 1 : 0;
      const sf0 = slopeField(bin, outW, outH);
      if (sf0.valid >= 6) {
        const m = median(Array.from(sf0.field));
        const th2 = Math.atan(m);
        if (Math.abs(th2) > (0.08 * Math.PI) / 180 && Math.abs(th2) < (8 * Math.PI) / 180) {
          Hfin = matMul3(Hfin, rotationAbout(th2, outW / 2, outH / 2));
          rect = warpGray(s.data, s.w, s.h, Hfin, outW, outH);
          norm = normalizeIllumination({ w: outW, h: outH, data: rect });
          thr = clamp(otsu(norm.hist), 100, 215);
          skew.angle += (th2 * 180) / Math.PI;
        }
      }
    }

    const analyse = async (base) => {
      let nd = base;
      for (let i = 0; i < bin.length; i++) bin[i] = nd[i] < thr ? 1 : 0;
      await stage('dewarp');
      const sf = slopeField(bin, outW, outH);
      const disp = displacementFromField(sf, outW, outH);
      let dew = 0;
      if (disp.maxAbs > 0.8) {
        nd = remapVertical(nd, outW, outH, disp);
        for (let i = 0; i < bin.length; i++) bin[i] = nd[i] < thr ? 1 : 0;
        dew = disp.maxAbs;
      }
      despeckle(bin, outW, outH);
      await stage('detect');
      let metrics = staffMetrics(bin, outW, outH);
      let binL = withFaintLines(nd, outW, outH, bin, metrics.thick);
      let det = detectStaves(binL, outW, outH, metrics, nd);
      let q = detectionQuality(binL, outW, outH, det);
      // refine with the detected lines when the paper is still curled; keep a pass only when the
      // staves it finds are at least as well supported by the image (a wrong curve can distort)
      for (let pass = 0; pass < 3 && det.staves.length; pass++) {
        const rc = residualCurl(det);
        if (rc.worst < 1.6) break;
        const good = det.staves.filter(staffConsistent);
        if (!good.length) break;
        const d2 = displacementFromLines(det, outW, outH, good.length < det.staves.length ? staffConsistent : null);
        if (d2.maxAbs < 1) break;
        const nd2 = remapVertical(nd, outW, outH, d2);
        for (let i = 0; i < bin.length; i++) bin[i] = nd2[i] < thr ? 1 : 0;
        despeckle(bin, outW, outH);
        await tick();
        const metrics2 = staffMetrics(bin, outW, outH);
        const binL2 = withFaintLines(nd2, outW, outH, bin, metrics2.thick);
        const det2 = detectStaves(binL2, outW, outH, metrics2, nd2);
        const q2 = detectionQuality(binL2, outW, outH, det2);
        if (det2.staves.length < det.staves.length * 0.9 || q2 < q * 0.97) {
          for (let i = 0; i < bin.length; i++) bin[i] = nd[i] < thr ? 1 : 0;
          despeckle(bin, outW, outH);
          break;
        }
        nd = nd2; det = det2; metrics = metrics2; q = Math.max(q, q2);
        dew = Math.max(dew, d2.maxAbs);
      }
      return { nd, det, metrics, dew };
    };
    let res = await analyse(norm.data);
    // upside-down check (also decides 90 vs 270)
    let flipped = false;
    if (opts.autoRotate !== false && res.det.staves.length) {
      const ss = startSideScore(bin, outW, outH, res.det);
      if (ss.score < -0.025) {
        const alt = Uint8Array.from(norm.data).reverse();
        const res2 = await analyse(alt);
        const ss2 = startSideScore(bin, outW, outH, res2.det);
        if (ss2.score > ss.score && res2.det.staves.length >= res.det.staves.length * 0.8) {
          res = res2;
          rot = (rot + 180) % 360;
          flipped = true;
        } else {
          // restore binary for the kept result
          for (let i = 0; i < bin.length; i++) bin[i] = res.nd[i] < thr ? 1 : 0;
          despeckle(bin, outW, outH);
        }
      }
    }
    const det = res.det;
    computeSignatures(bin, outW, outH, det);
    // tone curve for output
    const bp = Math.min(90, percentile(norm.hist, 0.004));
    const wp = Math.max(thr + 20, 228);
    const lut = toneLUT(bp, wp, 1.7);
    const gray = new Uint8Array(outW * outH);
    const nd = res.nd;
    for (let i = 0; i < gray.length; i++) gray[i] = lut[nd[i]];
    const thrOut = lut[thr];
    const bwLevel = lut[Math.round((thr + 255) / 2)];
    return {
      w: outW, h: outH, gray, thr: thrOut, bwLevel, det, corners, paper, skew: skew.angle,
      rotation: rot, flipped, dewarp: res.dew, ms: Date.now() - t0,
    };
  }

  // faint staff lines (light print, soft scans) as thin dark ridges; used for staff detection only
  function withFaintLines(nd, w, h, bin, thick) {
    const out = Uint8Array.from(bin);
    const r = Math.max(3, (thick || 2) + 1);
    for (let y = r; y < h - r; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) {
        const k = row + x;
        if (out[k]) continue;
        const v = nd[k];
        if (v > 238 || v > nd[k - w] || v > nd[k + w]) continue;
        if (v < Math.min(nd[k - r * w], nd[k + r * w]) - 16) out[k] = 1;
      }
    }
    return out;
  }

  // how well the detected staff lines are supported by thin ink in the image
  function staffEvidence(bin, w, h, st, thick) {
    const maxRun = (thick || 3) + 3;
    let good = 0, tot = 0;
    const x0 = Math.max(0, Math.round(st.xL)), x1 = Math.min(w - 1, Math.round(st.xR));
    for (const L of st.lines) {
      for (let x = x0; x <= x1; x += 3) {
        const yc = Math.round(L(x));
        tot++;
        for (let dy = -1; dy <= 1; dy++) {
          const y = yc + dy;
          if (y < 1 || y >= h - 1 || !bin[y * w + x]) continue;
          let a = y, b = y;
          while (a > 0 && bin[(a - 1) * w + x] && y - a <= maxRun) a--;
          while (b < h - 1 && bin[(b + 1) * w + x] && b - y <= maxRun) b++;
          if (b - a + 1 <= maxRun) { good++; break; }
        }
      }
    }
    return tot ? good / tot : 0;
  }
  // are the fitted lines of a staff evenly spaced all along it? (a wrong fragment join is not)
  function staffConsistent(st) {
    const n = st.lines.length;
    if (n < 4) return false;
    for (let k = 0; k <= 8; k++) {
      const x = st.xL + ((st.xR - st.xL) * k) / 8;
      const ys = st.lines.map((L) => L(x));
      const gaps = [];
      for (let i = 1; i < n; i++) gaps.push(ys[i] - ys[i - 1]);
      const g = median(gaps);
      if (g < 0.75 * st.spacing || g > 1.3 * st.spacing) return false;
      for (const d of gaps) if (d < 0.72 * g || d > 1.35 * g) return false;
    }
    return true;
  }
  function detectionQuality(bin, w, h, det) {
    let q = 0;
    for (const st of det.staves) {
      if (!staffConsistent(st)) continue;
      q += staffEvidence(bin, w, h, st, det.metrics.thick) * (st.xR - st.xL) * st.lines.length;
    }
    return q / w;
  }

  function despeckle(bin, w, h) {
    // remove isolated single pixels
    for (let y = 1; y < h - 1; y++) {
      const row = y * w;
      for (let x = 1; x < w - 1; x++) {
        const i = row + x;
        if (!bin[i]) continue;
        if (!bin[i - 1] && !bin[i + 1] && !bin[i - w] && !bin[i + w] && !bin[i - w - 1] && !bin[i - w + 1] && !bin[i + w - 1] && !bin[i + w + 1]) bin[i] = 0;
      }
    }
  }

  // --------------------------------------------------------------- layout
  // units: mm. items: [{w,h (px), group}] ; returns pages of placements
  function layoutStrips(items, o) {
    const pageW = o.pageW || 210, pageH = o.pageH || 297;
    const contentW = pageW - o.marginX * 2;
    const maxPx = Math.max(1, ...items.map((it) => it.w));
    let mmPerPx;
    if (o.scaleMode === 'fit') mmPerPx = contentW / maxPx;
    else mmPerPx = (o.srcMmPerPx || 210 / 2480) * (o.scale || 1);
    mmPerPx = Math.min(mmPerPx, contentW / maxPx);
    const pages = [];
    let page = null, y = 0;
    const newPage = () => {
      page = { items: [] };
      pages.push(page);
      y = o.marginTop + (pages.length === 1 ? o.firstPageHeader || 0 : o.otherPageHeader || 0);
    };
    newPage();
    const bottom = pageH - o.marginBottom;
    for (const it of items) {
      let hmm = it.h * mmPerPx, wmm = it.w * mmPerPx;
      let sc = 1;
      const avail = bottom - (o.marginTop + (o.otherPageHeader || 0));
      if (hmm > avail) { sc = avail / hmm; hmm *= sc; wmm *= sc; }
      if (page.items.length && y + hmm > bottom) newPage();
      const x = o.align === 'center' ? (pageW - wmm) / 2 : o.marginX;
      page.items.push({ ref: it, x, y, w: wmm, h: hmm });
      y += hmm + o.gap;
    }
    if (o.justify) {
      for (let p = 0; p < pages.length - 1; p++) {
        const its = pages[p].items;
        if (its.length < 2) continue;
        const last = its[its.length - 1];
        const extra = bottom - (last.y + last.h);
        if (extra <= 0) continue;
        const add = Math.min(extra / (its.length - 1), 25);
        its.forEach((it, k) => { it.y += add * k; });
