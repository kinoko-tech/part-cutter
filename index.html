<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="バンドスコアの写真・スキャンPDFから、ドラム・ギター・ベースなど指定したパートの段だけを切り抜いてA4に並べるツール。楽譜は端末の中だけで処理します。">
<meta name="theme-color" content="#1d5a4d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>パート譜カッター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
:root {
  --ground: #edf1ee;
  --surface: #ffffff;
  --surface-2: #f4f7f5;
  --ink: #16201c;
  --ink-2: #4f5e58;
  --ink-3: #7a8882;
  --line: #d3dbd6;
  --line-strong: #b5c2bb;
  --primary: #1d5a4d;
  --primary-hover: #174a40;
  --on-primary: #ffffff;
  --mat: #1e5a4e;
  --mat-grid: rgba(255, 255, 255, 0.07);
  --mat-grid-major: rgba(255, 255, 255, 0.15);
  --mat-text: #cfe4dc;
  --mat-text-2: #93bcb0;
  --marker: #f2b632;
  --marker-fill: rgba(242, 182, 50, 0.3);
  --marker-ink: #6b4700;
  --marker-soft: #fcefcc;
  --cut: #d9481f;
  --ok: #26734d;
  --ok-soft: #dcefe4;
  --warn: #b0500f;
  --warn-soft: #fbe6d4;
  --focus: #1d6fd1;
  --shadow-paper: 0 1px 2px rgba(8, 30, 24, 0.28), 0 10px 26px rgba(4, 26, 20, 0.3);
  --font-ui: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --bar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1412;
    --surface: #151d1a;
    --surface-2: #1b2521;
    --ink: #e2eae6;
    --ink-2: #a3b4ac;
    --ink-3: #7c8c85;
    --line: #29352f;
    --line-strong: #3b4a43;
    --primary: #2f8a74;
    --primary-hover: #37a086;
    --on-primary: #ffffff;
    --mat: #123a32;
    --mat-grid: rgba(255, 255, 255, 0.045);
    --mat-grid-major: rgba(255, 255, 255, 0.1);
    --mat-text: #b5d3c9;
    --mat-text-2: #7aa497;
    --marker: #f5c04a;
    --marker-fill: rgba(245, 192, 74, 0.32);
    --marker-ink: #f7d98f;
    --marker-soft: #3b3115;
    --cut: #ff7a4f;
    --ok: #62c28f;
    --ok-soft: #173327;
    --warn: #f19a5f;
    --warn-soft: #3a2517;
    --focus: #6aa8ff;
    --shadow-paper: 0 1px 2px rgba(0, 0, 0, 0.55), 0 12px 30px rgba(0, 0, 0, 0.6);
  }
}
:root[data-theme="dark"] {
  --ground: #0e1412;
  --surface: #151d1a;
  --surface-2: #1b2521;
  --ink: #e2eae6;
  --ink-2: #a3b4ac;
  --ink-3: #7c8c85;
  --line: #29352f;
  --line-strong: #3b4a43;
  --primary: #2f8a74;
  --primary-hover: #37a086;
  --on-primary: #ffffff;
  --mat: #123a32;
  --mat-grid: rgba(255, 255, 255, 0.045);
  --mat-grid-major: rgba(255, 255, 255, 0.1);
  --mat-text: #b5d3c9;
  --mat-text-2: #7aa497;
  --marker: #f5c04a;
  --marker-fill: rgba(245, 192, 74, 0.32);
  --marker-ink: #f7d98f;
  --marker-soft: #3b3115;
  --cut: #ff7a4f;
  --ok: #62c28f;
  --ok-soft: #173327;
  --warn: #f19a5f;
  --warn-soft: #3a2517;
  --focus: #6aa8ff;
  --shadow-paper: 0 1px 2px rgba(0, 0, 0, 0.55), 0 12px 30px rgba(0, 0, 0, 0.6);
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 14px/1.65 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: var(--bar-h);
  padding-inline: 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; flex: none; }
.wordmark { font-family: var(--font-display); font-weight: 400; font-size: 21px; letter-spacing: 0.02em; line-height: 1; }
.wordmark .blade { color: var(--primary); }
.tagline { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.steps { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.steps::-webkit-scrollbar { display: none; }
.step {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px 7px 8px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  font-weight: 500;
  white-space: nowrap;
}
.step .n {
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong);
  font: 500 12px/1 var(--font-num);
}
.step .lbl-s { display: none; }
.step:hover { background: var(--surface-2); }
@media (max-width: 440px) {
  .step .lbl { display: none; }
  .step .lbl-s { display: inline; }
}
.step[aria-current="step"] { color: var(--ink); background: var(--surface-2); border-color: var(--line); }
.step[aria-current="step"] .n { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.step.done .n { border-color: var(--ok); color: var(--ok); }
.busy {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
}
.busy .bar { width: 90px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.busy .bar i { display: block; height: 100%; background: var(--primary); width: 0; transition: width 0.3s; }

/* ---------- layout ---------- */
.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  min-height: calc(100% - var(--bar-h));
}
.mat {
  position: relative;
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--mat-grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-grid-major) 1px, transparent 1px),
    linear-gradient(var(--mat-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  background-position: -1px -1px;
  padding: 18px 24px 48px;
  min-width: 0;
}
.panel {
  background: var(--surface);
  border-left: 1px solid var(--line);
  padding: 22px 22px 40px;
  position: sticky;
  top: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
  align-self: start;
  max-height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px));
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.btn.jump { display: none; }
@media (max-width: 900px) {
  :root { --bar-h: 96px; }
  .main { grid-template-columns: 1fr; }
  .panel { position: static; max-height: none; border-left: 0; border-bottom: 1px solid var(--line); order: -1; padding: 18px 16px 22px; }
  .main[data-step="parts"] .panel, .main[data-step="fix"] .panel { order: 1; border-bottom: 0; border-top: 1px solid var(--line); }
  .mat { padding: 14px 16px 40px; }
  .topbar { flex-wrap: wrap; gap: 6px 12px; padding: 8px 16px 6px; }
  .wordmark { font-size: 18px; }
  .tagline { display: none; }
  .steps { order: 3; flex-basis: 100%; justify-content: space-between; }
  .step { padding: 5px 8px 5px 5px; gap: 5px; font-size: 13px; }
  .busy .bar { width: 56px; }
  .btn.jump { display: inline-flex; }
}

/* ---------- panel pieces ---------- */
.sect { display: flex; flex-direction: column; gap: 10px; }
.sect + .sect { padding-top: 18px; border-top: 1px solid var(--line); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-3); }
.title { font-size: 20px; font-weight: 700; line-height: 1.35; }
.lead { color: var(--ink-2); max-width: 36em; }
.hint { font-size: 12.5px; color: var(--ink-2); }
.hint.warn { color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.btn {
  box-sizing: border-box;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 7px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.wide { width: 100%; }
.btn .k { font-family: var(--font-num); font-weight: 500; }

/* file picker: the native input covers the whole button so the tap lands on it directly */
.btn.pick { position: relative; overflow: hidden; cursor: pointer; }
.btn.pick .pick-text { pointer-events: none; }
.pick-input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  margin: 0; padding: 0; border: 0;
  opacity: 0; cursor: pointer; font-size: 64px; z-index: 1;
  -webkit-tap-highlight-color: transparent;
}
.pick-input::-webkit-file-upload-button { cursor: pointer; }
.pick-input::file-selector-button { cursor: pointer; }
.btn.pick:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn.pick:active { transform: translateY(1px); }
.btn.pick.primary:active { background: var(--primary-hover); }
.pickhelp { font-size: 13px; color: var(--ink-2); }
.pickhelp summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 4px 0; }
.pickhelp[open] summary { margin-bottom: 4px; }
.pickhelp ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }
.pickhelp li > .row { margin-top: 6px; }
.pickhelp .input { margin-top: 6px; font-size: 12px; }
a.btn { text-decoration: none; }
.input.mono { font-family: var(--font-num); }

.drop {
  border: 1.5px dashed var(--line-strong);
  border-radius: 12px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--surface-2);
}
.drop.over { border-color: var(--primary); background: var(--ok-soft); }

.notice {
  border-radius: 10px;
  padding: 10px 12px;
  background: var(--marker-soft);
  color: var(--ink);
  font-size: 13px;
  display: flex; flex-direction: column; gap: 6px;
}
.notice strong { color: var(--marker-ink); }
.notice.warn { background: var(--warn-soft); }
.notice.warn strong { color: var(--warn); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 12px; font-weight: 600; line-height: 20px;
  white-space: nowrap;
  background: var(--surface-2); color: var(--ink-3);
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.marker { background: var(--marker-soft); color: var(--marker-ink); }
.chip.ref { background: var(--primary); color: var(--on-primary); }

.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.input, .select {
  min-height: 38px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  width: 100%;
  box-sizing: border-box;
}
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; padding: 2px; gap: 2px; background: var(--surface-2); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; color: var(--ink-2); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .sw { flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line-strong); position: relative; transition: background 0.15s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.toggle input:checked + .sw { background: var(--primary); }
.toggle input:checked + .sw::after { transform: translateX(16px); }
.toggle input:focus-visible + .sw { outline: 2px solid var(--focus); outline-offset: 2px; }

.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.stepper .ctl { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.stepper .ctl button { width: 34px; height: 32px; border: 0; background: var(--surface); font-size: 17px; line-height: 1; }
.stepper .ctl button:hover { background: var(--surface-2); }
.stepper .ctl output { min-width: 78px; text-align: center; font-family: var(--font-num); font-size: 13px; border-inline: 1px solid var(--line); padding: 5px 4px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 999px;
  padding: 5px 12px;
  font-weight: 600;
  min-height: 34px;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab[aria-selected="true"] { background: var(--marker-soft); border-color: var(--marker); color: var(--ink); }
.tab .sw-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--marker); }
.tab[aria-pressed="true"] { background: var(--marker-soft); border-color: var(--marker); color: var(--ink); }
.tab .chk { width: 9px; text-align: center; font-size: 12px; line-height: 1; color: var(--marker-ink); }
.tab[aria-pressed="false"] .chk { width: 0; margin-right: -6px; }
.tab:disabled { opacity: 0.5; cursor: default; }
.tab.add { border-style: dashed; }

.pagelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pagelist li {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.pagelist .thumb { width: 44px; height: 62px; object-fit: cover; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.pagelist .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pagelist .name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pagelist .sub { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pagelist .acts { display: flex; gap: 2px; }
.icon-btn { width: 32px; height: 32px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--ink-2); display: grid; place-items: center; font-size: 15px; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.icon-btn:disabled { opacity: 0.35; }

.syslist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.syslist li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 8px 5px 10px; border-top: 1px solid var(--line); background: var(--surface); }
.syslist li:first-child { border-top: 0; }
.syslist li.flag { background: var(--warn-soft); }
.syslist .where { font-family: var(--font-num); font-size: 12px; color: var(--ink-2); }
.syslist .what { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.syslist button { font-size: 12px; }
.tally { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.tally b { font-family: var(--font-num); font-weight: 600; color: var(--ink); font-size: 15px; margin-right: 2px; }

/* ---------- mat content ---------- */
.matbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--mat-text); margin-bottom: 14px; flex-wrap: wrap; }
.matbar .label { font-size: 13px; font-weight: 500; }
.matbar .label .num { color: var(--mat-text-2); }
.zoom { display: inline-flex; align-items: center; gap: 2px; background: rgba(0,0,0,.18); border-radius: 9px; padding: 2px; }
.zoom button { width: 34px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--mat-text); font-size: 18px; line-height: 1; }
.zoom button:hover { background: rgba(255,255,255,.1); }
.zoom output { min-width: 50px; text-align: center; font: 500 12px var(--font-num); color: var(--mat-text); }
.sheets { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.sheet-wrap { width: 100%; max-width: var(--sheet-max, 900px); display: flex; flex-direction: column; gap: 6px; }
.sheet-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; color: var(--mat-text); font-size: 12px; }
.sheet-cap .num { color: var(--mat-text-2); }
.sheet { position: relative; background: #fff; box-shadow: var(--shadow-paper); border-radius: 2px; overflow: hidden; }
.sheet img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.sheet canvas.ov { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }
.sheet.pending { aspect-ratio: 210 / 297; display: grid; place-items: center; color: #52605a; font-size: 13px; }
.sheet .state {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(255,255,255,.72); color: #22302b; font-weight: 600; font-size: 13px;
}
.scroller { width: 100%; overflow-x: auto; display: flex; flex-direction: column; align-items: center; }
.scroller.zoomed { align-items: flex-start; }
.grid-pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px; }
.grid-pages .sheet-wrap { max-width: none; }
.empty {
  color: var(--mat-text);
  border: 1.5px dashed rgba(255,255,255,.25);
  border-radius: 14px;
  padding: 40px 24px;
  text-align: center;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  max-width: 520px; margin: 40px auto;
}
.empty h3 { font-size: 17px; color: #fff; }
/* on the dark cutting mat the main button is a highlighter mark */
.empty .btn.primary { background: var(--marker); border-color: var(--marker); color: #2a1d00; }
.empty .btn.primary:hover { background: #e3a820; border-color: #e3a820; }
.editor { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1100px) { .editor { grid-template-columns: 1fr; } }
.a4 { aspect-ratio: 210 / 297; }
.outpages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--out-w, 420px)), 1fr)); gap: 26px; justify-items: center; }
.outpages .sheet-wrap { max-width: var(--out-w, 420px); }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px;
  z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px);
  pointer-events: none; /* never block the buttons underneath */
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#print-area { display: none; }
@media print {

<script>
/* Band score part extractor — image processing & layout engine (no DOM). */
(function (global) {
  'use strict';

  // ------------------------------------------------------------------ utils
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const median = (arr) => {
    if (!arr.length) return 0;
    const a = Float64Array.from(arr).sort();
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  };
  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function solveLinear(A, b) {
    const n = b.length;
    const M = A.map((row, i) => row.concat([b[i]]));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-12) return null;
      const tmp = M[c]; M[c] = M[p]; M[p] = tmp;
      for (let r = 0; r < n; r++) {
        if (r === c) continue;
        const f = M[r][c] / M[c][c];
        if (f === 0) continue;
        for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
      }
    }
    return M.map((row, i) => row[n] / row[i]);
  }

  // 3x3 homography (flat array) mapping src[i] -> dst[i]
  function homography(src, dst) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const x = src[i][0], y = src[i][1], u = dst[i][0], v = dst[i][1];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    const h = solveLinear(A, b);
    return h ? [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1] : null;
  }
  function matMul3(a, b) {
    const r = new Array(9);
    for (let i = 0; i < 3; i++)
      for (let j = 0; j < 3; j++)
        r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
    return r;
  }
  function applyH(H, x, y) {
    const w = H[6] * x + H[7] * y + H[8];
    return [(H[0] * x + H[1] * y + H[2]) / w, (H[3] * x + H[4] * y + H[5]) / w];
  }
  const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);

  // ------------------------------------------------------------ image basics
  function rgbaToGray(rgba, w, h) {
    const out = new Uint8Array(w * h);
    for (let i = 0, j = 0, n = w * h; j < n; i += 4, j++) {
      out[j] = (rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29) >> 8;
    }
    return out;
  }

  function downscaleMean(img, f) {
    const { w, h, data } = img;
    const W = Math.max(1, Math.floor(w / f)), H = Math.max(1, Math.floor(h / f));
    const out = new Uint8Array(W * H);
    const n = f * f;
    for (let Y = 0; Y < H; Y++) {
      for (let X = 0; X < W; X++) {
        let s = 0;
        for (let yy = Y * f, ye = yy + f; yy < ye; yy++) {
          const idx = yy * w + X * f;
          for (let k = 0; k < f; k++) s += data[idx + k];
        }
        out[Y * W + X] = (s / n + 0.5) | 0;
      }
    }
    return { w: W, h: H, data: out };
  }

  function downscaleMax(img, f) {
    const { w, h, data } = img;
    const W = Math.max(1, Math.floor(w / f)), H = Math.max(1, Math.floor(h / f));
    const out = new Uint8Array(W * H);
    for (let Y = 0; Y < H; Y++) {
      for (let X = 0; X < W; X++) {
        let m = 0;
        for (let yy = Y * f, ye = yy + f; yy < ye; yy++) {
          const idx = yy * w + X * f;
          for (let k = 0; k < f; k++) if (data[idx + k] > m) m = data[idx + k];
        }
        out[Y * W + X] = m;
      }
    }
    return { w: W, h: H, data: out };
  }

  function extremeFilter1D(src, w, h, r, horizontal, isMax) {
    const out = new Uint8Array(w * h);
    const outer = horizontal ? h : w, inner = horizontal ? w : h;
    for (let o = 0; o < outer; o++) {
      for (let i = 0; i < inner; i++) {
        const lo = Math.max(0, i - r), hi = Math.min(inner - 1, i + r);
        let m = isMax ? 0 : 255;
        for (let k = lo; k <= hi; k++) {
          const v = horizontal ? src[o * w + k] : src[k * w + o];
          if (isMax ? v > m : v < m) m = v;
        }
        if (horizontal) out[o * w + i] = m; else out[i * w + o] = m;
      }
    }
    return out;
  }
  function maxFilter(img, r) {
    const a = extremeFilter1D(img.data, img.w, img.h, r, true, true);
    return { w: img.w, h: img.h, data: extremeFilter1D(a, img.w, img.h, r, false, true) };
  }
  function minFilter(img, r) {
    const a = extremeFilter1D(img.data, img.w, img.h, r, true, false);
    return { w: img.w, h: img.h, data: extremeFilter1D(a, img.w, img.h, r, false, false) };
  }

  function boxBlurF(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      let acc = 0, cnt = 0;
      const row = y * w;
      for (let x = -r; x < w; x++) {
        const xa = x + r;
        if (xa < w) { acc += src[row + xa]; cnt++; }
        const xr = x - r - 1;
        if (xr >= 0) { acc -= src[row + xr]; cnt--; }
        if (x >= 0) tmp[row + x] = acc / cnt;
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0, cnt = 0;
      for (let y = -r; y < h; y++) {
        const ya = y + r;
        if (ya < h) { acc += tmp[ya * w + x]; cnt++; }
        const yr = y - r - 1;
        if (yr >= 0) { acc -= tmp[yr * w + x]; cnt--; }
        if (y >= 0) out[y * w + x] = acc / cnt;
      }
    }
    return out;
  }

  function sampleBilinear(data, w, h, x, y) {
    if (x < 0) x = 0; else if (x > w - 1) x = w - 1;
    if (y < 0) y = 0; else if (y > h - 1) y = h - 1;
    const x0 = Math.min(w - 2, Math.floor(x)), y0 = Math.min(h - 2, Math.floor(y));
    const fx = x - x0, fy = y - y0;
    const i = y0 * w + x0;
    return (data[i] * (1 - fx) + data[i + 1] * fx) * (1 - fy) + (data[i + w] * (1 - fx) + data[i + w + 1] * fx) * fy;
  }

  // ------------------------------------------------------- paper detection
  // rgba: small image (max side ~ 600). Returns {corners:[TL,TR,BR,BL], ok, score}
  function detectPaper(rgba, w, h) {
    const f = new Float32Array(w * h);
    let sumC = 0;
    for (let i = 0, j = 0; j < w * h; i += 4, j++) {
      const r = rgba[i], g = rgba[i + 1], b = rgba[i + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      f[j] = 0.299 * r + 0.587 * g + 0.114 * b - 0.6 * (mx - mn);
      sumC += mx - mn;
    }
    const rb = Math.max(1, Math.round(Math.min(w, h) / 220));
    const fb = boxBlurF(f, w, h, rb);
    const cx = w / 2, cy = h / 2;
    const K = 360;
    const D = Math.max(3, Math.round(Math.min(w, h) / 90));
    const tau = 9;
    const pts = [];
    const prof = new Float32Array(Math.ceil(Math.hypot(w, h)) + 2);
    const pre = new Float32Array(prof.length + 1);
    for (let k = 0; k < K; k++) {
      const ang = (2 * Math.PI * k) / K;
      const dx = Math.cos(ang), dy = Math.sin(ang);
      let n = 0;
      for (let t = 0; ; t++) {
        const x = cx + dx * t, y = cy + dy * t;
        if (x < 0 || y < 0 || x > w - 1 || y > h - 1) break;
        prof[n++] = sampleBilinear(fb, w, h, x, y);
      }
      if (n < 3 * D + 2) continue;
      pre[0] = 0;
      for (let t = 0; t < n; t++) pre[t + 1] = pre[t] + prof[t];
      let maxS = 0;
      const S = new Float32Array(n);
      for (let t = D; t < n - D; t++) {
        const inside = (pre[t] - pre[t - D]) / D;
        const outside = (pre[t + 1 + D] - pre[t + 1]) / D;
        S[t] = inside - outside;
        if (S[t] > maxS) maxS = S[t];
      }
      if (maxS < tau) continue;
      let pick = -1;
      for (let t = n - D - 1; t >= D; t--) {
        if (S[t] >= Math.max(tau, 0.5 * maxS) && S[t] >= S[t - 1] && S[t] >= S[t + 1]) { pick = t; break; }
      }
      if (pick < 0) continue;
      // outside should stay darker for a while (not just a thin line)
      const far = Math.min(n - 1, pick + 3 * D);
      const outsideLong = (pre[far + 1] - pre[pick + 1]) / Math.max(1, far - pick);
      const inside = (pre[pick] - pre[Math.max(0, pick - D)]) / Math.max(1, Math.min(D, pick));
      if (inside - outsideLong < 0.5 * S[pick]) continue;
      pts.push([cx + dx * pick, cy + dy * pick]);
    }
    const fallback = { corners: [[0, 0], [w - 1, 0], [w - 1, h - 1], [0, h - 1]], ok: false };
    if (pts.length < 40) return fallback;

    // RANSAC lines
    const rnd = mulberry32(12345);
    const tol = Math.max(1.5, Math.min(w, h) * 0.006);
    let remaining = pts.slice();
    const lines = [];
    for (let L = 0; L < 8 && remaining.length >= 10; L++) {
      let best = null, bestCnt = 0;
      for (let it = 0; it < 400; it++) {
        const p = remaining[(rnd() * remaining.length) | 0];
        const q = remaining[(rnd() * remaining.length) | 0];
        const len = dist(p, q);
        if (len < Math.min(w, h) * 0.1) continue;
        const nx = -(q[1] - p[1]) / len, ny = (q[0] - p[0]) / len;
        const c = -(nx * p[0] + ny * p[1]);
        let cnt = 0;
        for (const r of remaining) if (Math.abs(nx * r[0] + ny * r[1] + c) <= tol) cnt++;
        if (cnt > bestCnt) { bestCnt = cnt; best = [nx, ny, c]; }
      }
      if (!best || bestCnt < Math.max(10, pts.length * 0.06)) break;
      const inl = remaining.filter((r) => Math.abs(best[0] * r[0] + best[1] * r[1] + best[2]) <= tol * 1.5);
      const line = fitLineTLS(inl);
      if (!line) break;
      line.count = inl.length;
      lines.push(line);
      remaining = remaining.filter((r) => Math.abs(line.nx * r[0] + line.ny * r[1] + line.c) > tol * 2);
    }
    // paper brightness reference (central area)
    const centerVals = [];
    for (let y = Math.round(h * 0.3); y < h * 0.7; y += 4) for (let x = Math.round(w * 0.3); x < w * 0.7; x += 4) centerVals.push(fb[y * w + x]);
    centerVals.sort((p, q) => p - q);
    const paperRef = centerVals[Math.floor(centerVals.length * 0.8)] || 200;
    const fAt = (x, y) => sampleBilinear(fb, w, h, x, y);
    // a real page edge has a darker region outside that continues (not a thin band)
    const fRaw = (x, y) => f[Math.round(y) * w + Math.round(x)];
    const pct = (arr, q) => {
      if (!arr.length) return null;
      arr.sort((p, r) => p - r);
      return arr[Math.min(arr.length - 1, Math.floor(arr.length * q))];
    };
    const outsideTest = (l, inl) => {
      const dx = -l.ny, dy = l.nx;
      let tmin = Infinity, tmax = -Infinity;
      const px = -l.nx * l.c, py = -l.ny * l.c;
      for (const r of inl) { const t = (r[0] - px) * dx + (r[1] - py) * dy; tmin = Math.min(tmin, t); tmax = Math.max(tmax, t); }
      const sd = l.nx * cx + l.ny * cy + l.c;
      const ox = sd > 0 ? -l.nx : l.nx, oy = sd > 0 ? -l.ny : l.ny;
      const u = Math.max(4, Math.round(Math.min(w, h) / 50));
      let good = 0, valid = 0;
      for (let k = 0; k <= 30; k++) {
        const t = tmin + ((tmax - tmin) * k) / 30;
        const bx = px + dx * t, by = py + dy * t;
        // 70th percentile of the raw feature in a patch (robust to text on paper)
        const band = (a0, a1) => {
          const vals = [];
          let tot = 0;
          for (let q = a0; q <= a1; q++) {
            for (let s2 = -2; s2 <= 2; s2++) {
              tot++;
              const x = bx + ox * q + dx * s2 * (u / 4), y = by + oy * q + dy * s2 * (u / 4);
              if (x < 0 || y < 0 || x > w - 1 || y > h - 1) continue;
              vals.push(fRaw(x, y));
            }
          }
          return vals.length >= tot * 0.6 ? pct(vals, 0.7) : null;
        };
        const inside = band(-3 * u, -2);
        const near = band(2, 2 * u);
        const far = band(3 * u, 7 * u);
        if (inside === null || near === null) continue;
        valid++;
        if (far === null ? near < 0.8 * inside : near < 0.87 * inside && far < 0.9 * inside) good++;
      }
      return valid < 6 ? 0.5 : good / valid;
    };
    const cand = { top: [], bottom: [], left: [], right: [] };
    for (const l of lines) {
      const ang = Math.abs(Math.atan2(l.nx, -l.ny)) * 180 / Math.PI;
      const a = ang > 90 ? 180 - ang : ang;
      const inl = pts.filter((r) => Math.abs(l.nx * r[0] + l.ny * r[1] + l.c) <= tol * 1.5);
      const ot = outsideTest(l, inl);
      if (ot < 0.55) continue;
      const entry = { l, support: l.count / pts.length, ot };
      if (a < 40) {
        const y = -(l.nx * cx + l.c) / l.ny;
        (y < cy ? cand.top : cand.bottom).push(entry);
      } else if (a > 50) {
        const x = -(l.ny * cy + l.c) / l.nx;
        (x < cx ? cand.left : cand.right).push(entry);
      }
    }
    const border = {
      top: { nx: 0, ny: 1, c: 0 }, bottom: { nx: 0, ny: 1, c: -(h - 1) },
      left: { nx: 1, ny: 0, c: 0 }, right: { nx: 1, ny: 0, c: -(w - 1) },
    };
    // is paper likely cut by this image border? (bright strip along it)
    const borderPaper = (side) => {
      let bright = 0, n = 0;
      const m = 3;
      if (side === 'top' || side === 'bottom') {
        const y = side === 'top' ? m : h - 1 - m;
        for (let x = Math.round(w * 0.2); x < w * 0.8; x += 3) { n++; if (fb[y * w + x] > 0.8 * paperRef) bright++; }
      } else {
        const x = side === 'left' ? m : w - 1 - m;
        for (let y = Math.round(h * 0.2); y < h * 0.8; y += 3) { n++; if (fb[y * w + x] > 0.8 * paperRef) bright++; }
      }
      return bright / Math.max(1, n);
    };
    const sides = ['top', 'right', 'bottom', 'left'];
    let found = 0;
    for (const sd of sides) {
      if (cand[sd].length) found++;
      if (!cand[sd].length || borderPaper(sd) > 0.4) cand[sd].push({ l: border[sd], support: 0, border: true });
    }
    if (found < 2) return fallback;
    const inter = (a, b) => {
      const det = a.nx * b.ny - a.ny * b.nx;
      if (Math.abs(det) < 1e-9) return null;
      return [(-a.c * b.ny + a.ny * b.c) / det, (-a.nx * b.c + a.c * b.nx) / det];
    };
    let best = null;
    for (const T of cand.top) for (const Rr of cand.right) for (const B of cand.bottom) for (const L of cand.left) {
      const corners = [inter(T.l, L.l), inter(T.l, Rr.l), inter(B.l, Rr.l), inter(B.l, L.l)];
      if (corners.some((c) => !c || !isFinite(c[0]) || !isFinite(c[1]))) continue;
      if (corners.some((c) => c[0] < -0.12 * w || c[0] > 1.12 * w || c[1] < -0.12 * h || c[1] > 1.12 * h)) continue;
      if (!isConvex(corners)) continue;
      const area = polyArea(corners) / (w * h);
      if (area < 0.15) continue;
      const topL = dist(corners[0], corners[1]), botL = dist(corners[3], corners[2]);
      const lefL = dist(corners[0], corners[3]), rigL = dist(corners[1], corners[2]);
      const r1 = Math.abs(Math.log(topL / botL)), r2 = Math.abs(Math.log(lefL / rigL));
      if (r1 > 0.6 || r2 > 0.6) continue;
      let angOk = true;
      for (let i = 0; i < 4; i++) {
        const p0 = corners[(i + 3) % 4], p1 = corners[i], p2 = corners[(i + 1) % 4];
        const v1 = [p0[0] - p1[0], p0[1] - p1[1]], v2 = [p2[0] - p1[0], p2[1] - p1[1]];
        const cosA = (v1[0] * v2[0] + v1[1] * v2[1]) / (Math.hypot(...v1) * Math.hypot(...v2));
        const deg = Math.acos(clamp(cosA, -1, 1)) * 180 / Math.PI;
        if (deg < 50 || deg > 130) { angOk = false; break; }
      }
      if (!angOk) continue;
      const support = T.support + Rr.support + B.support + L.support;
      const nBorder = [T, Rr, B, L].filter((e) => e.border).length;
      const score = support + 0.3 * area - 0.7 * (r1 + r2) - 0.04 * nBorder;
      if (!best || score > best.score) best = { score, corners, nBorder };
    }
    if (!best || best.nBorder >= 3) return fallback;
    const corners = best.corners;
    for (const c of corners) {
      c[0] = clamp(c[0], -0.08 * w, 1.08 * w);
      c[1] = clamp(c[1], -0.08 * h, 1.08 * h);

    return { corners, ok: true, sides: 4 - best.nBorder };
  }

  function fitLineTLS(pts) {
    if (pts.length < 2) return null;
    let mx = 0, my = 0;
    for (const p of pts) { mx += p[0]; my += p[1]; }
    mx /= pts.length; my /= pts.length;
    let sxx = 0, syy = 0, sxy = 0;
    for (const p of pts) {
      const dx = p[0] - mx, dy = p[1] - my;
      sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
    }
    const theta = 0.5 * Math.atan2(2 * sxy, sxx - syy); // direction of max variance
    const dx = Math.cos(theta), dy = Math.sin(theta);
    const nx = -dy, ny = dx;
    return { nx, ny, c: -(nx * mx + ny * my) };
  }
  function polyArea(p) {
    let a = 0;
    for (let i = 0; i < p.length; i++) {
      const q = p[(i + 1) % p.length];
      a += p[i][0] * q[1] - q[0] * p[i][1];
    }
    return Math.abs(a) / 2;
  }
  function isConvex(p) {
    let sign = 0;
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length], c = p[(i + 2) % p.length];
      const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (Math.abs(cr) < 1e-9) continue;
      const s = Math.sign(cr);
      if (sign === 0) sign = s; else if (s !== sign) return false;
    }
    return true;
  }

  // height / width of the real rectangle behind a perspective quad (Zhang & He)
  function estimateAspect(c, w, h) {
    const avgW = (dist(c[0], c[1]) + dist(c[3], c[2])) / 2;
    const avgH = (dist(c[0], c[3]) + dist(c[1], c[2])) / 2;
    let ratio = avgH / avgW;
    const u0 = w / 2, v0 = h / 2;
    const m1 = [c[0][0] - u0, c[0][1] - v0, 1];
    const m2 = [c[1][0] - u0, c[1][1] - v0, 1];
    const m3 = [c[3][0] - u0, c[3][1] - v0, 1];
    const m4 = [c[2][0] - u0, c[2][1] - v0, 1];
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const k2 = dot(cross(m1, m4), m3) / dot(cross(m2, m4), m3);
    const k3 = dot(cross(m1, m4), m2) / dot(cross(m3, m4), m2);
    const n2 = [k2 * m2[0] - m1[0], k2 * m2[1] - m1[1], k2 * m2[2] - m1[2]];
    const n3 = [k3 * m3[0] - m1[0], k3 * m3[1] - m1[1], k3 * m3[2] - m1[2]];
    const L = Math.max(w, h);
    // perspective strong enough for a stable focal-length estimate?
    if (Math.abs(n2[2]) * L > 0.02 * Math.hypot(n2[0], n2[1]) && Math.abs(n3[2]) * L > 0.02 * Math.hypot(n3[0], n3[1])) {
      const f2 = -(n2[0] * n3[0] + n2[1] * n3[1]) / (n2[2] * n3[2]);
      if (isFinite(f2) && f2 > 0) {
        const f = Math.sqrt(f2);
        if (f > 0.5 * L && f < 4 * L) {
          const num = (n2[0] * n2[0] + n2[1] * n2[1]) / f2 + n2[2] * n2[2];
          const den = (n3[0] * n3[0] + n3[1] * n3[1]) / f2 + n3[2] * n3[2];
          const wh = Math.sqrt(num / den);
          const r = 1 / wh;
          if (isFinite(r) && Math.abs(r / ratio - 1) < 0.25) ratio = r;
        }
      }
    }
    return ratio;
  }

  // -------------------------------------------------------------- warping
  // H maps output coords -> source coords
  function warpGray(src, sw, sh, H, ow, oh, bg) {
    const out = new Uint8Array(ow * oh);
    const a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], hh = H[7], ii = H[8];
    const fill = bg === undefined ? 255 : bg;
    for (let y = 0; y < oh; y++) {
      const X0 = b * y + c, Y0 = e * y + f, W0 = hh * y + ii;
      let o = y * ow;
      for (let x = 0; x < ow; x++, o++) {
        const W = W0 + g * x;
        const sx = (X0 + a * x) / W, sy = (Y0 + d * x) / W;
        const x0 = Math.floor(sx), y0 = Math.floor(sy);
        if (x0 < 0 || y0 < 0 || x0 >= sw - 1 || y0 >= sh - 1) { out[o] = fill; continue; }
        const fx = sx - x0, fy = sy - y0;
        const i = y0 * sw + x0;
        const v = (src[i] * (1 - fx) + src[i + 1] * fx) * (1 - fy) + (src[i + sw] * (1 - fx) + src[i + sw + 1] * fx) * fy;
        out[o] = (v + 0.5) | 0;
      }
    }
    return out;
  }

  function rotationAbout(theta, cx, cy) {
    const co = Math.cos(theta), si = Math.sin(theta);
    // final -> rect : p_r = c + R (p_f - c)
    return [co, -si, cx - co * cx + si * cy, si, co, cy - si * cx - co * cy, 0, 0, 1];
  }

  // --------------------------------------------------- illumination / tone
  function normalizeIllumination(img) {
    const { w, h, data } = img;
    const f1 = Math.max(1, Math.round(Math.min(w, h) / 560));
    const a = downscaleMean(img, f1);
    const b = downscaleMax(a, 2);
    const F = f1 * 2;
    const R = Math.max(2, Math.round(40 / F));
    let bg = maxFilter(b, R);
    bg = minFilter(bg, R);
    const bgf = boxBlurF(bg.data, bg.w, bg.h, 2);
    const bw = bg.w, bh = bg.h;
    const xi = new Int32Array(w), xf = new Float32Array(w);
    for (let x = 0; x < w; x++) {
      let fx = (x + 0.5) / F - 0.5;
      fx = clamp(fx, 0, Math.max(0, bw - 1.001));
      xi[x] = Math.min(Math.floor(fx), Math.max(0, bw - 2));
      xf[x] = bw > 1 ? fx - xi[x] : 0;
    }
    const bgRow = new Float32Array(w);
    const out = new Uint8Array(w * h);
    // pass 1: histogram of ratios on a subsample to find paper level
    const hist = new Uint32Array(512);
    const rowBg = (y) => {
      let fy = clamp((y + 0.5) / F - 0.5, 0, Math.max(0, bh - 1.001));
      const y0 = Math.min(Math.floor(fy), Math.max(0, bh - 2));
      const ty = bh > 1 ? fy - y0 : 0;
      const r0 = y0 * bw, r1 = (bh > 1 ? y0 + 1 : y0) * bw;
      for (let x = 0; x < w; x++) {
        const i0 = xi[x], t = xf[x];
        const i1 = bw > 1 ? i0 + 1 : i0;
        const top = bgf[r0 + i0] * (1 - t) + bgf[r0 + i1] * t;
        const bot = bgf[r1 + i0] * (1 - t) + bgf[r1 + i1] * t;
        bgRow[x] = Math.max(8, top * (1 - ty) + bot * ty);
      }
    };
    for (let y = 0; y < h; y += 4) {
      rowBg(y);
      const row = y * w;
      for (let x = 0; x < w; x += 4) {
        const v = (data[row + x] * 255) / bgRow[x];
        hist[Math.min(511, v | 0)]++;
      }
    }
    let mode = 255, mv = 0;
    for (let v = 140; v < 400; v++) {
      const s = hist[v - 1] + hist[v] + hist[v + 1];
      if (s > mv) { mv = s; mode = v; }
    }
    const gain = 250 / mode;
    const hist2 = new Uint32Array(256);
    for (let y = 0; y < h; y++) {
      rowBg(y);
      const row = y * w;
      for (let x = 0; x < w; x++) {
        let v = (data[row + x] * 255 * gain) / bgRow[x];
        v = v > 255 ? 255 : v | 0;
        out[row + x] = v;
        hist2[v]++;
      }
    }
    return { data: out, w, h, hist: hist2 };
  }

  function otsu(hist) {
    let total = 0, sum = 0;
    for (let i = 0; i < 256; i++) { total += hist[i]; sum += i * hist[i]; }
    let sumB = 0, wB = 0, best = 0, thr = 128;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (!wB) continue;
      const wF = total - wB;
      if (!wF) break;
      sumB += t * hist[t];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) * (mB - mF);
      if (between > best) { best = between; thr = t; }
    }
    return thr;
  }

  function percentile(hist, p) {
    let total = 0;
    for (let i = 0; i < 256; i++) total += hist[i];
    let acc = 0;
    const target = total * p;
    for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= target) return i; }
    return 255;
  }

  function toneLUT(blackPoint, whitePoint, gamma) {
    const lut = new Uint8Array(256);
    for (let v = 0; v < 256; v++) {
      const t = clamp((v - blackPoint) / Math.max(1, whitePoint - blackPoint), 0, 1);
      lut[v] = Math.round(255 * Math.pow(t, gamma));
    }
    return lut;
  }

  // ------------------------------------------------------------ skew/slope
  function projScore(pts, n, t, H, halfW) {
    const off = Math.ceil(halfW * Math.abs(t)) + 2;
    const size = H + 2 * off + 3;
    const hist = new Float32Array(size);
    for (let k = 0; k < n; k += 2) {
      const yy = pts[k + 1] - pts[k] * t + off;
      const i0 = yy | 0;
      const fr = yy - i0;
      hist[i0] += 1 - fr;
      hist[i0 + 1] += fr;
    }
    let s = 0;
    for (let i = 0; i < size; i++) s += hist[i] * hist[i];
    return s;
  }

  function bestAngle(pts, n, H, halfW, maxDeg, coarse) {
    const scores = [];
    let best = -1, bestA = 0;
    for (let a = -maxDeg; a <= maxDeg + 1e-9; a += coarse) {
      const s = projScore(pts, n, Math.tan((a * Math.PI) / 180), H, halfW);
      scores.push(s);
      if (s > best) { best = s; bestA = a; }
    }
    const fine = coarse / 5;
    for (let a = bestA - coarse; a <= bestA + coarse + 1e-9; a += fine) {
      const s = projScore(pts, n, Math.tan((a * Math.PI) / 180), H, halfW);
      if (s > best) { best = s; bestA = a; }
    }
    const med = median(scores);
    return { angle: bestA, conf: med > 0 ? (best - med) / med : 0, best };
  }

  // are the staff lines running vertically? (page photographed sideways)
  // counts ink that belongs to long straight runs in each direction
  function isSideways(bin, w, h) {
    const L = Math.max(24, Math.round(Math.min(w, h) * 0.06));
    let hLong = 0, vLong = 0;
    for (let y = 0; y < h; y++) {
      let run = 0;
      const row = y * w;
      for (let x = 0; x <= w; x++) {
        if (x < w && bin[row + x]) run++;
        else { if (run >= L) hLong += run; run = 0; }
      }
    }
    for (let x = 0; x < w; x++) {
      let run = 0;
      for (let y = 0; y <= h; y++) {
        if (y < h && bin[y * w + x]) run++;
        else { if (run >= L) vLong += run; run = 0; }
      }
    }
    if (globalThis.__BSX_ORIENT) console.log('orient', { L, hLong, vLong });
    return vLong > 1.6 * hLong && vLong > 4 * L;
  }

  // upright (u,v) -> rect (x,y) for a clockwise rotation `rot` that makes the rect upright
  function rotMat(rot, Wr, Hr) {
    switch (((rot % 360) + 360) % 360) {
      case 90: return [0, 1, 0, -1, 0, Hr, 0, 0, 1];
      case 180: return [-1, 0, Wr, 0, -1, Hr, 0, 0, 1];
      case 270: return [0, -1, Wr, 1, 0, 0, 0, 0, 1];
      default: return [1, 0, 0, 0, 1, 0, 0, 0, 1];
    }
  }

  // positive when clefs / labels are on the left (page is not upside down)
  function startSideScore(bin, w, h, det) {
    const sp = det.metrics.space;
    const dens = (x0, x1, top, bot, pad) => {
      let ink = 0, n = 0;
      const xa = Math.max(0, Math.round(x0)), xb = Math.min(w - 1, Math.round(x1));
      for (let x = xa; x <= xb; x += 2) {
        const yt = Math.max(0, Math.round(top(x) - pad)), yb = Math.min(h - 1, Math.round(bot(x) + pad));
        for (let y = yt; y <= yb; y += 2) { n++; ink += bin[y * w + x]; }
      }
      return n ? ink / n : 0;
    };
    let score = 0, n = 0;
    for (const st of det.staves) {
      if (st.xR - st.xL < 20 * sp) continue;
      const inL = dens(st.xL + 0.4 * sp, st.xL + 3.4 * sp, st.top, st.bottom, 0);
      const inR = dens(st.xR - 3.4 * sp, st.xR - 0.4 * sp, st.top, st.bottom, 0);
      const outL = dens(st.xL - 8 * sp, st.xL - 1.2 * sp, st.top, st.bottom, 0.5 * sp);
      const outR = dens(st.xR + 1.2 * sp, st.xR + 8 * sp, st.top, st.bottom, 0.5 * sp);
      score += inL - inR + 0.5 * (outL - outR);
      n++;
    }
    return { score: n ? score / n : 0, n };
  }

  // global skew of a binary image (degrees)
  function estimateSkew(bin, w, h, maxDeg) {
    const stride = Math.max(1, Math.round(Math.sqrt((w * h) / 400000)));
    const pts = [];
    const cx = w / 2;
    for (let y = 0; y < h; y += stride) {
      const row = y * w;
      for (let x = 0; x < w; x += stride) if (bin[row + x]) pts.push(x - cx, y);
    }
    if (pts.length < 200) return { angle: 0, conf: 0 };
    return bestAngle(pts, pts.length, h, w / 2, maxDeg || 8, 0.4);
  }

  // local slope field (tan) on a coarse grid
  function slopeField(bin, w, h) {
    const gx = 8;
    const stepX = w / gx;
    const gy = Math.max(3, Math.round(h / (stepX * 1.1)));
    const stepY = h / gy;
    const winW = stepX * 2.4, winH = stepY * 2.0;
    const field = new Float32Array(gx * gy), conf = new Float32Array(gx * gy);
    const buf = new Float32Array(Math.ceil((winW / 2 + 2) * (winH / 2 + 2)) * 2 + 16);
    for (let j = 0; j < gy; j++) {
      for (let i = 0; i < gx; i++) {
        const cx = (i + 0.5) * stepX, cy = (j + 0.5) * stepY;
        const x0 = Math.max(0, Math.round(cx - winW / 2)), x1 = Math.min(w, Math.round(cx + winW / 2));
        const y0 = Math.max(0, Math.round(cy - winH / 2)), y1 = Math.min(h, Math.round(cy + winH / 2));
        let n = 0;
        for (let y = y0; y < y1; y += 2) {
          const row = y * w;
          for (let x = x0; x < x1; x += 2) {
            if (bin[row + x] && n + 2 <= buf.length) { buf[n++] = x - cx; buf[n++] = y - y0; }
          }
        }
        if (n < 600) { conf[j * gx + i] = 0; continue; }
        const r = bestAngle(buf, n, y1 - y0, (x1 - x0) / 2, 4, 0.3);
        field[j * gx + i] = Math.tan((r.angle * Math.PI) / 180);
        conf[j * gx + i] = r.conf;
      }
    }
    // fill unreliable cells from neighbours
    const valid = new Uint8Array(gx * gy);
    let nValid = 0;
    for (let k = 0; k < gx * gy; k++) if (conf[k] > 0.35) { valid[k] = 1; nValid++; }
    if (!nValid) return { field: new Float32Array(gx * gy), gx, gy, stepX, stepY, valid: 0 };
    const vals = [];
    for (let k = 0; k < gx * gy; k++) if (valid[k]) vals.push(field[k]);
    const med = median(vals);
    // reject outliers vs neighbourhood median
    const f2 = Float32Array.from(field);
    for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
      const k = j * gx + i;
      if (!valid[k]) continue;
      const nb = [];
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const jj = j + dj, ii = i + di;
        if (jj < 0 || ii < 0 || jj >= gy || ii >= gx) continue;
        if (valid[jj * gx + ii]) nb.push(field[jj * gx + ii]);
      }
      const m = median(nb);
      if (Math.abs(field[k] - m) > 0.012) f2[k] = m;
    }
    for (let k = 0; k < gx * gy; k++) field[k] = f2[k];
    let pending = gx * gy - nValid;
    let guard = 0;
    while (pending > 0 && guard++ < gx + gy) {
      const add = [];
      for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
        const k = j * gx + i;
        if (valid[k]) continue;
        let s = 0, c = 0;
        for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
          const jj = j + dj, ii = i + di;
          if (jj < 0 || ii < 0 || jj >= gy || ii >= gx) continue;
          if (valid[jj * gx + ii]) { s += field[jj * gx + ii]; c++; }
        }
        if (c) add.push([k, s / c]);
      }
      if (!add.length) break;
      for (const [k, v] of add) { field[k] = v; valid[k] = 1; pending--; }
    }
    for (let k = 0; k < gx * gy; k++) if (!valid[k]) field[k] = med;
    // smooth
    const sm = new Float32Array(gx * gy);
    for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
      let s = 0, c = 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const jj = j + dj, ii = i + di;
        if (jj < 0 || ii < 0 || jj >= gy || ii >= gx) continue;
        const wgt = dj === 0 && di === 0 ? 2 : 1;
        s += field[jj * gx + ii] * wgt; c += wgt;
      }
      sm[j * gx + i] = s / c;
    }
    return { field: sm, gx, gy, stepX, stepY, valid: nValid };
  }

  function displacementFromField(sf, w, h) {
    const dx = 16, dy = 12;
    const nx = Math.ceil((w - 1) / dx) + 1, ny = Math.ceil((h - 1) / dy) + 1;
    const D = new Float32Array(nx * ny);
    const { field, gx, gy, stepX, stepY } = sf;
    const slopeAt = (x, y) => {
      const fx = clamp(x / stepX - 0.5, 0, gx - 1), fy = clamp(y / stepY - 0.5, 0, gy - 1);
      const i0 = Math.min(gx - 2, Math.floor(fx)), j0 = Math.min(gy - 2, Math.floor(fy));
      if (gx < 2 || gy < 2) return field[0];
      const tx = fx - i0, ty = fy - j0;
      const k = j0 * gx + i0;
      return (field[k] * (1 - tx) + field[k + 1] * tx) * (1 - ty) + (field[k + gx] * (1 - tx) + field[k + gx + 1] * tx) * ty;
    };
    const xc = Math.round(nx / 2);
    let maxAbs = 0;
    for (let r = 0; r < ny; r++) {
      const y0 = r * dy;
      D[r * nx + xc] = 0;
      let y = y0;
      for (let c = xc + 1; c < nx; c++) {
        const xp = (c - 1) * dx;
        const k1 = slopeAt(xp, y);
        const k2 = slopeAt(xp + dx / 2, y + (k1 * dx) / 2);
        y += k2 * dx;
        D[r * nx + c] = y - y0;
      }
      y = y0;
      for (let c = xc - 1; c >= 0; c--) {
        const xp = (c + 1) * dx;
        const k1 = slopeAt(xp, y);
        const k2 = slopeAt(xp - dx / 2, y - (k1 * dx) / 2);
        y -= k2 * dx;
        D[r * nx + c] = y - y0;
      }
    }
    for (let k = 0; k < D.length; k++) maxAbs = Math.max(maxAbs, Math.abs(D[k]));
    return { D, nx, ny, dx, dy, maxAbs };
  }

  // displacement field from detected staff lines (precise, follows sharp curls)
  function displacementFromLines(det, w, h, use) {
    const dx = 16, dy = 12;
    const nx = Math.ceil((w - 1) / dx) + 1, ny = Math.ceil((h - 1) / dy) + 1;
    const D = new Float32Array(nx * ny);
    const lines = [];
    for (const st of det.staves) {
      if (use && !use(st)) continue;
      const xc = clamp(w / 2, st.xL, st.xR);
      for (const L of st.lines) lines.push({ f: L, x0: st.xL, x1: st.xR, yref: L(xc) });
    }
    lines.sort((a, b) => a.yref - b.yref);
    const filled = new Uint8Array(nx);
    let maxAbs = 0;
    for (let c = 0; c < nx; c++) {
      const x = c * dx;
      const samp = [];
      for (const L of lines) {
        if (x < L.x0 - 0.04 * w || x > L.x1 + 0.04 * w) continue;
        const xx = clamp(x, L.x0, L.x1);
        samp.push([L.yref, L.f(xx) - L.yref]);
      }
      if (samp.length < 2) continue;
      filled[c] = 1;
      let k = 0;
      for (let r = 0; r < ny; r++) {
        const y0 = r * dy;
        while (k + 1 < samp.length - 1 && samp[k + 1][0] < y0) k++;
        let d;
        if (y0 <= samp[0][0]) d = samp[0][1];
        else if (y0 >= samp[samp.length - 1][0]) d = samp[samp.length - 1][1];
        else {
          const a = samp[k], b = samp[k + 1];
          const t = (y0 - a[0]) / Math.max(1e-6, b[0] - a[0]);
          d = a[1] + (b[1] - a[1]) * clamp(t, 0, 1);
        }
        D[r * nx + c] = d;
        if (Math.abs(d) > maxAbs) maxAbs = Math.abs(d);
      }
    }
    // columns without staves copy their nearest filled neighbour
    for (let c = 0; c < nx; c++) {
      if (filled[c]) continue;
      let best = -1;
      for (let d = 1; d < nx && best < 0; d++) {
        if (c - d >= 0 && filled[c - d]) best = c - d;
        else if (c + d < nx && filled[c + d]) best = c + d;
      }
      if (best < 0) continue;
      for (let r = 0; r < ny; r++) D[r * nx + c] = D[r * nx + best];
    }
    return { D, nx, ny, dx, dy, maxAbs };
  }

  // how far detected lines still are from straight (px)
  function residualCurl(det) {
    let worst = 0;
    const vals = [];
    for (const st of det.staves) {
      const f = st.top, g = st.bottom;
      const xs = [];
      for (let k = 0; k <= 10; k++) xs.push(st.xL + ((st.xR - st.xL) * k) / 10);
      for (const L of [f, g]) {
        const y0 = L(xs[0]), y1 = L(xs[10]);
        let m = 0;
        for (let k = 1; k < 10; k++) {
          const lin = y0 + ((y1 - y0) * k) / 10;
          m = Math.max(m, Math.abs(L(xs[k]) - lin));
        }
        vals.push(m);
        worst = Math.max(worst, m);
      }
    }
    return { worst, median: median(vals) };
  }

  function remapVertical(data, w, h, disp) {
    const out = new Uint8Array(w * h);
    const { D, nx, ny, dx, dy } = disp;
    const col = new Float32Array(w);
    for (let y = 0; y < h; y++) {
      const ry = y / dy;
      const r0 = Math.min(ny - 2, Math.floor(ry));
      const ty = ry - r0;
      for (let x = 0; x < w; x++) {
        const cx = x / dx;
        const c0 = Math.min(nx - 2, Math.floor(cx));
        const tx = cx - c0;
        const k = r0 * nx + c0;
        col[x] = (D[k] * (1 - tx) + D[k + 1] * tx) * (1 - ty) + (D[k + nx] * (1 - tx) + D[k + nx + 1] * tx) * ty;
      }
      const row = y * w;
      for (let x = 0; x < w; x++) {
        const sy = y + col[x];
        if (sy < 0 || sy > h - 1) { out[row + x] = 255; continue; }
        const y0 = Math.min(h - 2, Math.floor(sy));
        const f = sy - y0;
        out[row + x] = (data[y0 * w + x] * (1 - f) + data[(y0 + 1) * w + x] * f + 0.5) | 0;
      }
    }
    return out;
  }

  // ------------------------------------------------------- staff detection
  function staffMetrics(bin, w, h) {
    const black = new Float64Array(64), white = new Float64Array(400);
    const step = Math.max(1, Math.round(w / 260));
    for (let x = Math.round(w * 0.06); x < w * 0.94; x += step) {
      let cur = bin[x], run = 1;
      for (let y = 1; y < h; y++) {
        const v = bin[y * w + x];
        if (v === cur) { run++; continue; }
        if (cur) { if (run < 64) black[run]++; } else if (run < 400) white[run]++;
        cur = v; run = 1;
      }
    }
    let thick = 2, bv = -1;
    for (let r = 1; r < 20; r++) {
      const s = black[r] + 0.5 * (black[r - 1] + black[r + 1]);
      if (s > bv) { bv = s; thick = r; }
    }
    let wsp = 12;
    let wv = -1;
    for (let r = 4; r < 398; r++) {
      const s = white[r] + 0.6 * (white[r - 1] + white[r + 1]) + 0.25 * (white[r - 2] + white[r + 2]);
      if (s > wv) { wv = s; wsp = r; }
    }
    return { thick, space: wsp + thick };
  }

  function polyfit(pts, deg, w) {
    const n = pts.length;
    const k = deg + 1;
    const A = [], b = [];
    for (let i = 0; i < k; i++) { A.push(new Array(k).fill(0)); b.push(0); }
    for (const p of pts) {
      const u = (p[0] - w / 2) / w;
      const pw = [1, u, u * u];
      for (let i = 0; i < k; i++) {
        b[i] += pw[i] * p[1];
        for (let j = 0; j < k; j++) A[i][j] += pw[i] * pw[j];
      }
    }
    const sol = n >= k ? solveLinear(A, b) : null;
    if (!sol) {
      const my = pts.reduce((s, p) => s + p[1], 0) / Math.max(1, n);
      return [my, 0, 0];
    }
    while (sol.length < 3) sol.push(0);
    return sol;
  }

  function makeCurve(coef, x0, x1, w) {
    const f = (x) => {
      const u = (x - w / 2) / w;
      return coef[0] + coef[1] * u + coef[2] * u * u;
    };
    const df = (x) => (coef[1] + 2 * coef[2] * ((x - w / 2) / w)) / w;
    const y0 = f(x0), y1 = f(x1), s0 = df(x0), s1 = df(x1);
    return (x) => {
      if (x < x0) return y0 + s0 * (x - x0);
      if (x > x1) return y1 + s1 * (x - x1);
      return f(x);
    };
  }

  // fast curve: samples every `step` px with linear interpolation / extrapolation
  function lutCurve(fn, w, step) {
    const st = step || 4;
    const n = Math.ceil((w - 1) / st) + 2;
    const t = new Float32Array(n);
    for (let i = 0; i < n; i++) t[i] = fn(i * st);
    const s0 = (t[1] - t[0]) / st, s1 = (t[n - 1] - t[n - 2]) / st;
    return (x) => {
      if (x <= 0) return t[0] + s0 * x;
      const fx = x / st;
      const i = Math.floor(fx);
      if (i >= n - 1) return t[n - 1] + s1 * (x - (n - 1) * st);
      const f = fx - i;
      return t[i] + (t[i + 1] - t[i]) * f;
    };
  }
  // piecewise-linear curve through track points (outliers removed, lightly smoothed)
  function plCurve(pts, sp, w) {
    const n = pts.length;
    if (n < 3) return null;
    const ys = pts.map((p) => p[1]);
    const keep = [];
    for (let k = 0; k < n; k++) {
      const nb = [];
      for (const d of [-2, -1, 1, 2]) if (k + d >= 0 && k + d < n) nb.push(ys[k + d] + (d !== 0 ? 0 : 0));
      // compare with neighbours' linear prediction
      const pred = [];
      if (k >= 1 && k + 1 < n) pred.push(ys[k - 1] + (ys[k + 1] - ys[k - 1]) * (pts[k][0] - pts[k - 1][0]) / Math.max(1, pts[k + 1][0] - pts[k - 1][0]));
      if (k >= 2) pred.push(ys[k - 1] + (ys[k - 1] - ys[k - 2]) * (pts[k][0] - pts[k - 1][0]) / Math.max(1, pts[k - 1][0] - pts[k - 2][0]));
      if (k + 2 < n) pred.push(ys[k + 1] - (ys[k + 2] - ys[k + 1]) * (pts[k + 1][0] - pts[k][0]) / Math.max(1, pts[k + 2][0] - pts[k + 1][0]));
      const m = pred.length ? median(pred) : median(nb);
      if (Math.abs(ys[k] - m) <= Math.max(1.2, 0.2 * sp)) keep.push([pts[k][0], ys[k]]);
    }
    if (keep.length < 3) return null;
    const sm = keep.map((p, k) => {
      if (k === 0 || k === keep.length - 1) return p;
      return [p[0], 0.25 * keep[k - 1][1] + 0.5 * p[1] + 0.25 * keep[k + 1][1]];
    });
    const m = sm.length;
    const endSlope = (a, b) => clamp((b[1] - a[1]) / Math.max(1, b[0] - a[0]), -0.12, 0.12);
    const sA = m >= 3 ? endSlope(sm[0], sm[2]) : endSlope(sm[0], sm[1]);
    const sB = m >= 3 ? endSlope(sm[m - 3], sm[m - 1]) : endSlope(sm[m - 2], sm[m - 1]);
    const f = (x) => {
      if (x <= sm[0][0]) return sm[0][1] + sA * (x - sm[0][0]);
      if (x >= sm[m - 1][0]) return sm[m - 1][1] + sB * (x - sm[m - 1][0]);
      let lo = 0, hi = m - 1;
      while (hi - lo > 1) { const md = (lo + hi) >> 1; if (sm[md][0] <= x) lo = md; else hi = md; }
      const t = (x - sm[lo][0]) / Math.max(1e-6, sm[hi][0] - sm[lo][0]);
      return sm[lo][1] + (sm[hi][1] - sm[lo][1]) * t;
    };
    return lutCurve(f, w, 4);
  }

  function detectStaves(bin, w, h, metricsIn, grayIn) {
    const metrics = metricsIn || staffMetrics(bin, w, h);
    const sp = metrics.space, th = metrics.thick;
    const nS = clamp(Math.round(w / (sp * 7)), 8, 48);
    const sx = [];
    for (let s = 0; s <= nS; s++) sx.push(Math.round((s * w) / nS));
    const sliceOf = new Uint16Array(w);

    // evidence of a staff line along a curve shifted by `off`
    const lineEvidence = (curve, x0, x1, off) => {

    const staves = [];
