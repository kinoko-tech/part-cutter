    const o = part.opts;
    if (hk === undefined) hk = headerKinds(part);
    const key = [sys.key, sel.a, sel.b, hk ? hk.join('+') : '-', o.label, o.up, o.down].join('|');
    let r = regionCache.get(key);
    if (!r) {
      const pr = sys.page.proc;
      const gray = pr.gray, W = pr.w, thr = pr.thr;
      const pageObj = { w: pr.w, h: pr.h, det: pr.det, isInk: (x, y) => gray[y * W + x] < thr };
      r = E.computeRegion(pageObj, sys.si, sel.a, sel.b, { header: !!hk, headerKinds: hk, label: o.label, extraUp: o.up, extraDown: o.down });
      regionCache.set(key, r);
    }
    return r;
  }
  // the staff ranges that a set of parts takes from one system, top to bottom; touching ranges are
  // cut out as one piece (with its own settings taken from the upper part), the others are stacked.
  // The marks above the system follow what any of the parts needs.
  function partRegions(parts, sys) {
    const rs = [];
    for (const p of parts) {
      const x = p.sel[sys.key];
      if (isChosen(x)) rs.push({ a: x.a, b: x.b, part: p });
    }
    rs.sort((p, q) => p.a - q.a);
    const groups = [];
    for (const r of rs) {
      const last = groups[groups.length - 1];
      if (last && r.a <= last.b + 1) last.b = Math.max(last.b, r.b);
      else groups.push({ a: r.a, b: r.b, part: r.part });
    }
    let hk = null;
    for (const p of parts) {
      const k = headerKinds(p);
      if (k) hk = (hk || []).concat(k.filter((x) => !(hk || []).includes(x)));
    }
    return groups.map((g, i) => ({ sel: g, part: g.part, hk: i ? null : hk, region: regionFor(g.part, sys, g, i ? null : hk) }));
  }
  function stackStrips(list, sp) {
    const minX = Math.min(...list.map((q) => q.region.x0));
    const offs = list.map((q) => Math.round(q.region.x0 - minX));
    const W = Math.max(...list.map((q, i) => offs[i] + q.ex.strip.w));
    const gap = Math.round(0.8 * sp);
    const H = list.reduce((a, q) => a + q.ex.strip.h, 0) + gap * (list.length - 1);
    const data = new Uint8Array(W * H).fill(255);
    let y = 0;
    list.forEach((q, i) => {
      const st = q.ex.strip;
      for (let r = 0; r < st.h; r++) data.set(st.data.subarray(r * st.w, (r + 1) * st.w), (y + r) * W + offs[i]);
      y += st.h + gap;
    });
    const h0 = list[0].ex.header;
    const header = h0 ? Object.assign({}, h0, { offsetX: (h0.offsetX || 0) - offs[0] }) : null;
    return { strip: { w: W, h: H, data }, header };
  }
  function collectStrips(parts) {
    const items = [];
    for (const s of docSystems()) {
      const regs = partRegions(parts, s);
      if (!regs.length) continue;
      const pr = s.page.proc;
      const list = regs.map((q) => ({ region: q.region, ex: E.extractRegion(pr.gray, pr.w, pr.h, q.region) }));
      const ex = list.length === 1 ? list[0].ex : stackStrips(list, pr.det.metrics.space);
      const mm = s.page.mmPerPx;
      const hh = ex.header ? ex.header.h : 0;
      const off = ex.header ? (ex.header.offsetX || 0) : 0;
      const opt = (q) => [q.part.id, q.sel.a + '-' + q.sel.b, q.part.opts.label, q.part.opts.up, q.part.opts.down].join(':');
      items.push({
        key: s.key + '|' + regs.map(opt).join('+') + '|' + (regs[0].hk || []).join('+'),
        strip: ex.strip, header: ex.header, level: pr.bwLevel,
        wmm: ex.strip.w * mm, hmm: (ex.strip.h + hh) * mm, offmm: off * mm, mmPerPx: mm, fracW: ex.strip.w / pr.w, pageKey: s.page.id,
        spmm: (pr.det.stdSpace || pr.det.metrics.space || 0) * mm,
      });
    }
    return items;
  }

  // -------------------------------------------------------------- layout
  function layout(groups, over) {
    // groups: [{part, items}]; over: prefs to override (e.g. {pages: 0})
    // returns { pages: [{items:[{it,x,y,w,h}], part, firstOfPart}], scale, size, tooSmall }
    const P = Object.assign({}, prefs, over || {});
    const pageW = 210, pageH = 297;
    const contentW = pageW - 2 * P.marginX;
    const headRoom = P.heading ? 9 : 0;
    // scans and photos differ in scale from page to page: bring every strip to the same staff size
    const all = [];
    for (const g of groups) for (const it of g.items) all.push(it);
    const sps = all.map((it) => it.spmm).filter((v) => v > 0).sort((a, b) => a - b);
    const medSp = sps.length ? sps[sps.length >> 1] : 0;
    for (const it of all) {
      const f = medSp && it.spmm ? medSp / it.spmm : 1;
      it.norm = Math.abs(f - 1) < 0.02 ? 1 : Math.min(1.25, Math.max(0.8, f));
    }
    // "fit": full-length systems fill the width exactly. Scanned pages are often scaled a little
    // differently across and down the page, so those strips are stretched sideways only and every
    // staff keeps the common size. Clearly shorter systems (short codas) keep the common scale.
    const fit = P.scaleMode === 'fit';
    const wNs = all.map((it) => it.wmm * it.norm);
    const sortedW = wNs.slice().sort((a, b) => a - b);
    const maxW = Math.max(1, sortedW[sortedW.length - 1] || 1);
    const hiW = sortedW.length ? sortedW[Math.min(sortedW.length - 1, Math.floor(sortedW.length * 0.9))] : maxW;
    // share of the page width is not affected by that distortion
    const bigFr = all.filter((it, i) => wNs[i] >= 0.85 * hiW && it.fracW > 0).map((it) => it.fracW).sort((a, b) => a - b);
    const medFr = bigFr.length ? bigFr[bigFr.length >> 1] : 0;
    all.forEach((it, i) => { it.full = wNs[i] >= 0.85 * hiW || (medFr > 0 && it.fracW >= 0.93 * medFr); });
    const fullW = all.filter((it) => it.full).map((it) => it.wmm * it.norm).sort((a, b) => a - b);
    const refW = fit && fullW.length ? fullW[fullW.length >> 1] : maxW;
    // header bands may reach left of the staff (rehearsal marks); keep them on the page
    let inset = 0, scale = 1;
    for (let it2 = 0; it2 < 3; it2++) {
      const avail = contentW - inset;
      scale = fit ? avail / refW : Math.min(P.scale / 100, avail / maxW);
      let off = 0;
      const pageSx = new Map();
      if (fit) {
        for (const it of all) {
          if (!it.full) continue;
          const l = pageSx.get(it.pageKey) || [];
          l.push(avail / (it.wmm * it.norm * scale));
          pageSx.set(it.pageKey, l);
        }
      }
      for (const it of all) {
        const nat = it.wmm * it.norm * scale;
        let sx = 1, u = 1;
        if (fit && it.full) sx = avail / nat;
        else if (pageSx.has(it.pageKey)) {
          // a short system takes the sideways correction of the full ones on its page
          const l = pageSx.get(it.pageKey).slice().sort((a, b) => a - b);
          sx = l[l.length >> 1];
        }
        if (sx < 0.85) { u = sx / 0.85; sx = 0.85; } else if (sx > 1.22) sx = 1.22;
        if (nat * u * sx > avail) u *= avail / (nat * u * sx);
        it.u = u;
        it.sx = sx;
        off = Math.max(off, (it.offmm || 0) * it.norm * scale * u * sx);
      }
      inset = Math.max(0, off - P.marginX + 3);
    }
    const pages = [];
    const bottom = pageH - P.marginBottom - (P.pageNo ? 5 : 0);
    const top = P.marginTop + headRoom;
    // width of a full-length strip at the common scale (smaller strips are centred on it)
    const fullWidth = fit ? contentW - inset : Math.min(contentW - inset, maxW * scale);
    const multi = groups.length > 1;
    const paginate = (g, gapK, sizeK) => {
      const out = [];
      let page = null, y = 0;
      const open = () => {
        page = { items: [], part: g.part, firstOfPart: !out.length, multi };
        out.push(page);
        y = top;
      };
      open();
      const dx = sizeK < 1 ? (fullWidth * (1 - sizeK)) / 2 : 0;
      for (const it of g.items) {
        const k0 = it.norm * scale * it.u * sizeK;
        let w = it.wmm * k0 * it.sx, h = it.hmm * k0;
        if (h > bottom - top) { const k = (bottom - top) / h; w *= k; h *= k; }
        if (page.items.length && y + h > bottom) open();
        page.items.push({ it, x: P.marginX + inset + dx, y, w, h });
        y += h + P.gap * gapK;
      }
      return out;
    };
    const target = Math.max(0, Math.round(P.pages || 0));
    let size = 1, tooSmall = false;
    for (const g of groups) {
      let mine = paginate(g, 1, 1);
      if (target && mine.length > target) {
        // a page count was chosen: close up the gaps first, then make the strips smaller
        let best = null;
        for (const gk of [0.5, 0.25]) {
          const alt = paginate(g, gk, 1);
          if (alt.length <= target) { best = alt; break; }
        }
        if (!best) {
          const gk = 0.25;
          let lo = MIN_FIT, hi = 1;
          if (paginate(g, gk, lo).length > target) tooSmall = true;
          else {
            for (let i = 0; i < 12; i++) {
              const mid = (lo + hi) / 2;
              if (paginate(g, gk, mid).length <= target) lo = mid; else hi = mid;
            }
          }
          best = paginate(g, gk, lo);
          size = Math.min(size, lo);
        }
        mine = best;
      } else if (!target && mine.length > 1 && mine[mine.length - 1].items.length <= 2) {
        // avoid a last page holding only one or two strips: tighten the gaps, then shrink a little
        for (const [gk, sk] of [[0.6, 1], [0.35, 1], [0.35, 0.97], [0.35, 0.94]]) {
          const alt = paginate(g, gk, sk);
          if (alt.length < mine.length) { mine = alt; break; }
        }
      }
      if (P.justify) {
        mine.slice(0, -1).forEach((pg) => {
          if (pg.items.length < 2) return;
          const last = pg.items[pg.items.length - 1];
          const extra = bottom - (last.y + last.h);
          if (extra <= 0) return;
          const add = Math.min(extra / (pg.items.length - 1), 18);
          pg.items.forEach((q, k) => { q.y += add * k; });
        });
      }
      pages.push(...mine);
    }
    for (const g of groups) {
      const mine = pages.filter((p) => p.part === g.part);
      mine.forEach((p, i) => { p.partPageNo = i; p.partPageCount = mine.length; });
    }
    return { pages, scale, size, tooSmall };
  }
  // text at the top right: the part on its first page, "曲名（2/3）" on the pages after it
  function headingText(pg, idx, count) {
    if (pg.firstOfPart) return pg.part.name;
    const n = (pg.partPageNo != null ? pg.partPageNo : idx) + 1;
    const total = pg.partPageCount != null ? pg.partPageCount : count;
    const name = state.title ? state.title + (pg.multi ? ' ' + pg.part.name : '') : pg.part.name;
    return `${name}（${n}/${total}）`;
  }

  const bitmapCache = new Map();
  function stripCanvas(strip, level, bw) {
    const c = makeCanvas(strip.w, strip.h);
    const g = c.getContext('2d');
    const id = g.createImageData(strip.w, strip.h);
    const d = id.data;
    const lo = level - 26, hi = level + 26;
    for (let i = 0, j = 0; i < strip.data.length; i++, j += 4) {
      let v = strip.data[i];
      if (bw) v = v <= lo ? 0 : v >= hi ? 255 : Math.round(((v - lo) / (hi - lo)) * 255);
      d[j] = d[j + 1] = d[j + 2] = v;
      d[j + 3] = 255;
    }
    g.putImageData(id, 0, 0);
    return c;
  }
  function cachedStrip(it, which, bw) {
    const k = it.key + '|' + which + '|' + (bw ? 1 : 0);
    let c = bitmapCache.get(k);
    if (!c) {
      c = stripCanvas(which === 'h' ? it.header : it.strip, it.level, bw);
      bitmapCache.set(k, c);
      if (bitmapCache.size > 300) bitmapCache.delete(bitmapCache.keys().next().value);
    }
    return c;
  }
  function drawOutPage(pg, idx, count, dpi) {
    const pxmm = dpi / 25.4;
    const c = makeCanvas(210 * pxmm, 297 * pxmm);
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    const P = prefs;
    const font = '"IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif';
    g.fillStyle = '#111';
    g.textBaseline = 'alphabetic';
    if (P.heading) {
      const base = (P.marginTop + 5.5) * pxmm;
      if (pg.firstOfPart && state.title) {
        g.font = `700 ${5 * pxmm}px ${font}`;
        g.textAlign = 'left';
        g.fillText(state.title, P.marginX * pxmm, base, (210 - 2 * P.marginX - 40) * pxmm);
      }
      g.font = `600 ${3.4 * pxmm}px ${font}`;
      g.textAlign = 'right';
      const room = pg.firstOfPart && state.title ? 38 : 210 - 2 * P.marginX;
      g.fillText(headingText(pg, idx, count), (210 - P.marginX) * pxmm, base, room * pxmm);
      g.strokeStyle = '#999';
      g.lineWidth = Math.max(1, 0.2 * pxmm);
      g.beginPath();
      g.moveTo(P.marginX * pxmm, base + 1.8 * pxmm);
      g.lineTo((210 - P.marginX) * pxmm, base + 1.8 * pxmm);
      g.stroke();
    }
    for (const q of pg.items) {
      const it = q.it;
      const hh = it.header ? it.header.h : 0;
      const tot = it.strip.h + hh;
      // strips may be stretched sideways (see layout), so the two axes scale separately
      const sy = (q.h * pxmm) / tot;
      const sx = (q.w * pxmm) / it.strip.w;
      let y = q.y * pxmm;
      if (it.header) {
        const offPx = (it.header.offsetX || 0) * sx;
        g.drawImage(cachedStrip(it, 'h', P.bw), q.x * pxmm - offPx, y, it.header.w * sx, hh * sy);
        y += hh * sy;
      }
      g.drawImage(cachedStrip(it, 's', P.bw), q.x * pxmm, y, it.strip.w * sx, it.strip.h * sy);
    }
    if (P.pageNo) {
      g.font = `500 ${3 * pxmm}px ${font}`;
      g.textAlign = 'center';
      g.fillStyle = '#444';
      const n = pg.partPageNo != null ? pg.partPageNo : idx;
      const c2 = pg.partPageCount != null ? pg.partPageCount : count;
      g.fillText(`${n + 1} / ${c2}`, 105 * pxmm, (297 - P.marginBottom + 1) * pxmm);
    }
    return c;
  }
  // what goes to paper: the chosen parts, on one sheet (stacked per system) or each on its own pages
  function outputGroups() {
    const parts = chosenParts().filter((p) => p.ref);
    if (!parts.length) return [];
    if (parts.length === 1 || state.outPart === 'separate') {
      return parts.map((part) => ({ part, items: collectStrips([part]) })).filter((g) => g.items.length);
    }
    const combo = { id: 'c:' + parts.map((p) => p.id).join('+'), name: outputName(parts), parts };
    const items = collectStrips(parts);
    return items.length ? [{ part: combo, items }] : [];
  }
  const outputName = (parts) => parts.map((p) => p.name).join('＋');

  async function exportPdf(btn) {
    const groups = outputGroups();
    if (!groups.length) { toast('出力する段がありません。③でパートを選んでください'); return; }
    btn.disabled = true;
    const old = btn.textContent;
    try {
      btn.textContent = 'PDFを作成中…';
      await loadScript(CDN.jspdf);
      const { jsPDF } = window.jspdf;
      const { pages } = layout(groups);
      const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
      for (let i = 0; i < pages.length; i++) {
        btn.textContent = `PDFを作成中… ${i + 1}/${pages.length}`;
        await TICK();
        const c = drawOutPage(pages[i], i, pages.length, 300);
        const url = c.toDataURL('image/jpeg', 0.9);
        c.width = c.height = 1;
        if (i) doc.addPage('a4', 'portrait');
        doc.addImage(url, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      }
      const blob = doc.output('blob');
      const partName = groups.length > 1 ? outputName(groups.map((g) => g.part)) : groups[0].part.name;
      await saveFile(blob, safeName((state.title ? state.title + '_' : '') + partName) + '.pdf');
    } catch (e) {
      console.error(e);
      toast('PDFを作れませんでした：' + (e.message || e));
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }
  async function printOut(btn) {
    const groups = outputGroups();
    if (!groups.length) { toast('印刷する段がありません。③でパートを選んでください'); return; }
    btn.disabled = true;
    try {
      const { pages } = layout(groups);
      const area = $('#print-area');
      area.querySelectorAll('img').forEach((i) => URL.revokeObjectURL(i.src));
      area.textContent = '';
      for (let i = 0; i < pages.length; i++) {
        await TICK();
        const c = drawOutPage(pages[i], i, pages.length, 300);
        const img = el('img', { alt: '' });
        img.src = URL.createObjectURL(await canvasBlob(c, 'image/jpeg', 0.92));
        c.width = c.height = 1;
        area.appendChild(img);
      }
      await Promise.all(Array.from(area.querySelectorAll('img')).map((i) => i.decode().catch(() => {})));
      window.print();
      if (framed || isTouch) setTimeout(() => toast('印刷画面が開かないときは「PDFを保存」→ 保存したPDFを開いて印刷してください', 7000), 600);
    } catch (e) {
      toast('印刷を開始できませんでした。「PDFを保存」から印刷してください');
    } finally {
      btn.disabled = false;
    }
  }

  // ------------------------------------------------------------- render
  const root = { bar: null, panel: null, mat: null };
  let renderQueued = false;
  function softRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
  }
  function updateBusy() {
    const b = $('#busy');
    if (!b) return;
    const { total, done } = state.busy;
    const working = state.pages.some((p) => p.status === 'busy' || p.status === 'wait');
    b.hidden = !working && !state.opening;
    if (!working && state.opening) {
      $('#busy-text').textContent = 'PDFを開いています…';
      $('#busy-bar').style.width = '8%';
    }
    if (working) {
      const cur = state.pages.find((p) => p.status === 'busy');
      $('#busy-text').textContent = `処理中 ${Math.min(done + 1, total || 1)}/${total || 1}` + (cur && cur.message ? `・${cur.message}` : '');
      $('#busy-bar').style.width = `${Math.round((done / Math.max(1, total)) * 100)}%`;
    }
  }

  const STEPS = [
    ['load', '読み込み', '読込'],
    ['fix', '用紙補正', '補正'],
    ['parts', 'パート選択', 'パート'],
    ['output', 'A4出力', '出力'],
  ];
  function go(step) {
    state.step = step;
    render();
    window.scrollTo({ top: 0 });
  }
  function render() {
    const mainEl = $('.main');
    if (mainEl) mainEl.setAttribute('data-step', state.step);
    renderBar();
    renderPanel();
    renderMat();
    updateBusy();
    persist();
  }
  function persist() {
    store('layout', prefs);
    store('partOpts', activePart().opts);
  }

  function renderBar() {
    const steps = $('#steps');
    steps.textContent = '';
    STEPS.forEach(([k, label, short], i) => {
      const doneMark = (k === 'load' && state.pages.some((p) => p.status === 'done'))
        || (k === 'parts' && activePart().ref);
      steps.append(el('button', {
        class: 'step' + (doneMark && state.step !== k ? ' done' : ''),
        'aria-current': state.step === k ? 'step' : null,
        onclick: () => go(k),
        'aria-label': `手順${i + 1} ${label}`,
      }, el('span', { class: 'n' }, String(i + 1)), el('span', { class: 'lbl' }, label), el('span', { class: 'lbl-s' }, short)));
    });
  }

  // ---- panel
  function renderPanel() {
    const p = root.panel;
    p.textContent = '';
    const fn = { load: panelLoad, fix: panelFix, parts: panelParts, output: panelOutput }[state.step];
    fn(p);
  }
  function sampleNotice() {
    if (!state.sample) return null;
    return el('div', { class: 'notice' },
      el('strong', null, 'サンプルで表示中'),
      el('p', null, '架空のバンドスコア2ページで、ドラムパートを選んだ状態です。自分の楽譜を読み込むと置き換わります。'));
  }
  // ---- file picking
  // The real <input type=file> is stretched over the visible button, so the tap lands on the
  // input itself. Some in-app browsers ignore input.click() called from script.
  // build.py fills this in only for the copy that runs inside the Claude app
  const ARTIFACT_URL = '__ARTIFACT_URL__';
  const inClaude = framed && /^https:\/\//.test(ARTIFACT_URL);
  const APP_URL = inClaude ? ARTIFACT_URL : location.href.split('#')[0];
  let pickSeq = 0;
  let pickWatch = 0;
  function pickSettled() { clearTimeout(pickWatch); pickWatch = 0; }
  function armPickWatch() {
    pickSettled();
    const t0 = Date.now();
    const settle = () => { pickSettled(); window.removeEventListener('blur', settle); document.removeEventListener('visibilitychange', settle); };
    window.addEventListener('blur', settle, { once: true });
    document.addEventListener('visibilitychange', settle, { once: true });
    pickWatch = setTimeout(() => {
      window.removeEventListener('blur', settle);
      document.removeEventListener('visibilitychange', settle);
      pickWatch = 0;
      if (Date.now() - t0 < 1500 || document.hidden) return;
      const h = $('#pick-help');
      if (h) { if (!h.open) { h.open = true; h.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
      else toast('ファイル選択が開かないときは、①読み込みの「ファイル選択の画面が開かないときは」を見てください', 6000);
    }, 2600);
  }
  function pickButton(label, o) {
    o = o || {};
    const input = el('input', {
      type: 'file', id: 'pick-' + (o.camera ? 'cam' : 'file') + '-' + (++pickSeq), class: 'pick-input',
      accept: o.camera ? 'image/*' : 'image/*,application/pdf,.pdf,.heic,.heif',
      multiple: !o.camera, capture: o.camera ? 'environment' : null, title: label,
      onclick: armPickWatch,
      oncancel: pickSettled,
      onchange: (e) => {
        pickSettled();
        const files = Array.from(e.target.files || []);
        e.target.value = '';

  function drawEditor(cv, img, loupe) {

        g.setLineDash([6 * dpr, 4 * dpr]);
        g.lineWidth = 1.6 * dpr;
        g.strokeStyle = mine ? (flag ? '#b0500f' : '#d9481f') : '#2a64b0';
        g.stroke();
        if (r.header && mine) {
          const hd = r.header;
          path(hd.curve, hd.from, hd.curve, -hd.to);
          g.fillStyle = hexA(fill, 0.14);
          g.fill();
          g.stroke();
        }
        g.setLineDash([]);
        if (!mine) {
          // name of the other part at its right end
          const fs = Math.max(10, 10 * dpr);
          g.font = `600 ${fs}px "IBM Plex Sans JP", sans-serif`;
          const tw = g.measureText(q.name).width + 10 * dpr;
          const tx = r.x1 * k - tw, ty = (r.topCurve(r.x1) - r.up) * k;
          g.fillStyle = '#2a64b0';
          roundRect(g, tx, ty, tw, fs + 6 * dpr, 4 * dpr);
          g.fill();
          g.fillStyle = '#fff';
          g.textBaseline = 'top';
          g.fillText(q.name, tx + 5 * dpr, ty + 3 * dpr);
        }
      }
      // tag
      const tag = sel ? (sel.mode === 'ref' ? '基準' : sel.mode === 'manual' ? '手動' : sel.mode === 'off' ? '除外' : needsCheck(sel) ? '要確認' : sel.mode === 'none' ? 'なし' : '') : '';
      if (tag) {
        const fs = Math.max(10, 11 * dpr);
        g.font = `600 ${fs}px "IBM Plex Sans JP", sans-serif`;
        const tw = g.measureText(tag).width + 10 * dpr;
        const tx = 3 * dpr, ty = by0;
        g.fillStyle = tag === '要確認' ? '#b0500f' : tag === '基準' ? '#1d5a4d' : tag === '手動' ? '#8a5b00' : '#6c7a74';
        roundRect(g, tx, ty, tw, fs + 8 * dpr, 4 * dpr);
        g.fill();
        g.fillStyle = '#fff';
        g.textBaseline = 'top';
        g.fillText(tag, tx + 5 * dpr, ty + 4 * dpr);
      }
    }
  }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function hexA(color, a) {
    const m = /^#?([0-9a-f]{6})$/i.exec(color.trim());
    if (!m) return `rgba(242,182,50,${a})`;
    const n = parseInt(m[1], 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }
  function onSheetTap(e, cv, pg) {
    const r = cv.getBoundingClientRect();
    const pr = pg.proc;
    const x = ((e.clientX - r.left) / r.width) * pr.w;
    const y = ((e.clientY - r.top) / r.height) * pr.h;
    const sp = pr.det.metrics.space;
    const cssTol = (18 / r.width) * pr.w;
    let best = null, bd = Infinity;
    for (const s of docSystems().filter((q) => q.page === pg)) {
      s.staves.forEach((st, idx) => {
        if (x < st.xL - 3 * sp || x > st.xR + 2 * sp) return;
        const xx = Math.max(st.xL, Math.min(st.xR, x));
        const t = st.top(xx), b = st.bottom(xx);
        const d = y < t ? t - y : y > b ? y - b : 0;
        if (d < bd) { bd = d; best = { s, idx }; }
      });
    }
    if (!best || bd > Math.max(2.2 * sp, cssTol)) return;
    const part = activePart();
    tapStaff(part, best.s, best.idx);
    render();
  }

  // output preview
  let outToken = 0;
  function matOutput(m) {
    m.textContent = '';
    const groups = outputGroups();
    const zoomBar = matZoomBar('', () => state.outZoom, (z) => { state.outZoom = z; render(); });
    if (!groups.length) {
      m.append(el('div', { class: 'matbar' }, el('span', { class: 'label' }, 'A4プレビュー')));
      m.append(el('div', { class: 'empty' }, el('h3', null, '出力する段がまだありません'),
        el('p', null, '③パート選択で、抜き出したいパートの譜表をタップしてください。'),
        el('button', { class: 'btn primary', onclick: () => go('parts') }, 'パート選択へ')));
      return;
    }
    const { pages } = layout(groups);
    m.append(el('div', { class: 'matbar' },
      el('span', { class: 'label' }, 'A4プレビュー ', el('span', { class: 'num' }, `${pages.length}ページ`)), zoomBar));
    const wrap = el('div', { class: 'outpages', style: `--out-w:${Math.round(420 * state.outZoom)}px` });
    m.append(wrap);
    const token = ++outToken;
    const holders = pages.map((pg, i) => {
      const sheet = el('div', { class: 'sheet a4' });
      wrap.append(el('div', { class: 'sheet-wrap' },
        el('div', { class: 'sheet-cap' }, el('span', null, `${i + 1}ページ`), el('span', { class: 'num' }, pg.part.name)),
        sheet));
      return sheet;
    });
    (async () => {
      for (let i = 0; i < pages.length; i++) {
        await TICK();
        if (token !== outToken) return;
        const c = drawOutPage(pages[i], i, pages.length, 110 * Math.min(2, window.devicePixelRatio || 1) * Math.max(1, state.outZoom * 0.8));
        c.style.cssText = 'width:100%;height:auto;display:block';
        c.setAttribute('role', 'img');
        c.setAttribute('aria-label', `出力プレビュー ${i + 1}ページ目`);
        holders[i].append(c);
      }
    })();
  }

  // ------------------------------------------------------------- sample
  async function loadSample() {
    const srcs = window.BSX_SAMPLE || [];
    if (!srcs.length) return;
    clearSample();
    prefs.pages = 0;
    state.sample = true;
    state.title = 'Summer Test Drive（サンプル）';
    for (let i = 0; i < srcs.length; i++) {
      const [head, b64] = srcs[i].split(',');
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      const blob = new Blob([bytes], { type: head.slice(5, head.indexOf(';')) });
      addPage({ name: `サンプル p${i + 1}`, srcType: 'image', file: blob, kind: 'flat' });
    }
    state.step = 'parts';
    activePart().name = activePart().name || 'ドラム';
    render();
    runQueue();
  }

  // --------------------------------------------------------------- init
  function init() {
    window.addEventListener('error', (e) => {
      const m = (e && e.message) || '';
      if (!m || /ResizeObserver|Script error/i.test(m)) return;
      toast('エラーが起きました：' + m, 7000);
    });
    window.addEventListener('unhandledrejection', (e) => {
      const r = e && e.reason;
      const m = (r && r.message) || String(r || '');
      if (!m || /ResizeObserver/i.test(m)) return;
      toast('エラーが起きました：' + m, 7000);
    });
    root.panel = $('#panel');
    root.mat = $('#mat');
    const drop = document.body;
    drop.addEventListener('dragover', (e) => { e.preventDefault(); const d = $('.drop'); if (d) d.classList.add('over'); });
    drop.addEventListener('dragleave', (e) => { if (e.target === document.body || !e.relatedTarget) { const d = $('.drop'); if (d) d.classList.remove('over'); } });
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      const d = $('.drop'); if (d) d.classList.remove('over');
      if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
    });
    let rt = 0;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { if (state.step === 'parts') renderMat(); }, 150);
    });
    window.PartCutter = { state, prefs, addFiles, go, loadSample, docSystems, layout, outputGroups, drawOutPage, headingText, tapStaff, render, exportPdf, sourceCanvas };
    render(); // starts empty; the sample is one tap away on the empty mat
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
